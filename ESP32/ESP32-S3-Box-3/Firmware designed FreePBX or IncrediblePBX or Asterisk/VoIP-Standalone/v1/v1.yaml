            id: caller_ext_label
            text: "${voip_test_account_extension}"
            text_font: font_medium
            text_color: 0x2ECC71
            x: 75
            y: 124
        # Live mic gain adjustment during an active call - writes straight to
        # the ES7210 ADC register (no capture restart), so the level changes
        # instantly and the caller can ask "can you hear me now?" on the
        # spot. Same global as the Settings page control, so whatever level
        # they land on here is what's saved/restored going forward.
        - label:
            text: "MIC LEVEL:"
            text_font: font_small
            text_color: 0xFFFFFF
            x: 8
            y: 160
        - label:
            id: incall_mic_gain_label
            text: "24.0dB"
            text_font: font_small
            text_color: 0xFFFFFF
            x: 105
            y: 160
        - button:
            id: incall_mic_down_btn
            x: 170
            y: 154
            width: 36
            height: 30
            radius: 8
            bg_color: 0x1F2632
            widgets:
              - label:
                  text: "-"
                  align: CENTER
                  text_font: font_medium
            on_click:
              - lambda: |-
                  float g = id(mic_gain_db) - 3.0;
                  if (g < 0.0) g = 0.0;
                  id(mic_gain_db) = g;
              - audio_adc.set_mic_gain:
                  id: es7210_adc
                  mic_gain: !lambda 'return id(mic_gain_db);'
              - lambda: |-
                  char buf[12];
                  snprintf(buf, sizeof(buf), "%.1fdB", id(mic_gain_db));
                  lv_label_set_text(id(incall_mic_gain_label), buf);
                  lv_label_set_text(id(mic_gain_label), buf);
        - button:
            id: incall_mic_up_btn
            x: 212
            y: 154
            width: 36
            height: 30
            radius: 8
            bg_color: 0x1F2632
            widgets:
              - label:
                  text: "+"
                  align: CENTER
                  text_font: font_medium
            on_click:
              - lambda: |-
                  float g = id(mic_gain_db) + 3.0;
                  if (g > 37.5) g = 37.5;
                  id(mic_gain_db) = g;
              - audio_adc.set_mic_gain:
                  id: es7210_adc
                  mic_gain: !lambda 'return id(mic_gain_db);'
              - lambda: |-
                  char buf[12];
                  snprintf(buf, sizeof(buf), "%.1fdB", id(mic_gain_db));
                  lv_label_set_text(id(incall_mic_gain_label), buf);
                  lv_label_set_text(id(mic_gain_label), buf);
        # MINIMIZE just drops back to the home page - the call itself
        # keeps running (SIP audio isn't tied to which LVGL page is
        # shown), and the flashing icon on the home page lets you jump
        # back here. The green button answers while ringing, cancels
        # while dialing out, then turns into a red End Call button once
        # connected.
        - button:
            id: hangup_btn
            x: 5
            y: 186
            width: 150
            height: 48
            radius: 12
            bg_color: 0xE74C3C
            widgets:
              - label:
                  text: "MINIMIZE CALL"
                  align: CENTER
                  text_font: font_small
                  text_color: 0xFFFFFF
            on_click:
              - globals.set:
                  id: current_page
                  value: '"home"'
              - lvgl.page.show: home_page
        - button:
            id: answer_btn
            x: 165
            y: 186
            width: 150
            height: 48
            radius: 12
            bg_color: 0x2ECC71
            widgets:
              - label:
                  id: answer_btn_label
                  text: "ANSWER"
                  align: CENTER
                  text_font: font_medium
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  # Once connected, or while we're the one dialing out
                  # (call_is_outgoing), this button always hangs up/cancels.
                  # It only answers when we're on the receiving end of a
                  # still-ringing incoming call.
                  condition:
                    lambda: 'return id(call_active) || id(call_is_outgoing);'
                  then:
                    - sip_client.hangup: phone
                  else:
                    - sip_client.answer: phone

