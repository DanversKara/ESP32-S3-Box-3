select:
  # Button and text color pickers for all four speed dial buttons, exposed
  # as HA select entities (Settings > Devices > this device) so colors can
  # be changed without reflashing. Options map to fixed hex colors below;
  # add more names/hex pairs to the options + lambda pair together if you
  # want a bigger palette.
  - platform: template
    name: "Speed Dial Office Button Color"
    id: speed_dial_office_button_color
    icon: "mdi:palette"
    entity_category: config
    optimistic: true
    restore_value: true
    options: ["Gray", "Blue", "Green", "Red", "Orange", "Purple", "White"]
    initial_option: "Gray"
    on_value:
      - lambda: |-
          uint32_t c = 0x1F2632;
          if (x == "Blue") c = 0x3D7BFF;
          else if (x == "Green") c = 0x2ECC71;
          else if (x == "Red") c = 0xE74C3C;
          else if (x == "Orange") c = 0xFFA500;
          else if (x == "Purple") c = 0x8E44AD;
          else if (x == "White") c = 0xFFFFFF;
