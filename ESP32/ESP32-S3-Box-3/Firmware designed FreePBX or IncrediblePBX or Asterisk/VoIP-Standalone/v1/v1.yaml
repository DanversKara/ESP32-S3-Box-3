switch:
  - platform: template
    name: "Speaker Mute"
    id: speaker_mute
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - audio_dac.mute_on: es8311_dac
      - lvgl.widget.update:
          id: mute_switch
          state:
            checked: true
    turn_off_action:
      - audio_dac.mute_off: es8311_dac
      - lvgl.widget.update:
          id: mute_switch
          state:
            checked: false
  - platform: template
    name: "Intercom Auto Answer"
    id: voip_auto_answer
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - globals.set:
          id: auto_answer_enabled
          value: 'true'
      - lvgl.widget.update:
          id: auto_answer_switch
          state:
            checked: true
      - script.execute: update_status_icons
    turn_off_action:
      - globals.set:
          id: auto_answer_enabled
          value: 'false'
      - lvgl.widget.update:
          id: auto_answer_switch
          state:
            checked: false
      - script.execute: update_status_icons
  - platform: gpio
    id: speaker_enable
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_ON

text:
  # Editable from the ESPHome device page in HA, same as the switches above.
  # optimistic: true means the entity just stores/reports back whatever it's
  # set to - no lambda needed. restore_value: true keeps it across reboots.
  - platform: template
    name: "Speed Dial Office Number"
    id: speed_dial_office_number
    icon: "mdi:phone"
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    min_length: 0
    max_length: 32
    initial_value: "705"
  - platform: template
    name: "Speed Dial Office Label"
    id: speed_dial_office_label
