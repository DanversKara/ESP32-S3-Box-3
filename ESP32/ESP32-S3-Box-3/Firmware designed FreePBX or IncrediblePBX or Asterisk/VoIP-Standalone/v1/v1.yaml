  - platform: mipi_spi
    id: s3_box_lcd
    model: S3BOX
    data_rate: 40MHz
    cs_pin: 5
    dc_pin: 4
    reset_pin:
      number: 48
      inverted: true
    color_order: bgr
    invert_colors: false

touchscreen:
  - platform: gt911
    id: box_touch
    i2c_id: bus_a
    display: s3_box_lcd

