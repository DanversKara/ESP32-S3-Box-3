text:
  - platform: template
    name: "Caption - Apt/Unit"
    id: door_caption_message
    icon: "mdi:card-text-outline"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "APT 666"
    max_length: 20
    on_value:
      - lambda: |-
          lv_label_set_text(id(doorbell_caption_label), id(door_caption_message).state.c_str());
  - platform: template
    name: "Message - Available"
    id: available_message
    icon: "mdi:message-text"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "We're here — ring the bell!"
    max_length: 40
    on_value:
      - script.execute: apply_availability_status
  - platform: template
    name: "Message - After Hours"
    id: unavailable_message
    icon: "mdi:message-text-outline"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "We're away right now. Please leave a message."
    max_length: 60
    on_value:
      - script.execute: apply_availability_status
  - platform: template
    name: "Message - Police Mode"
    id: police_mode_message
    icon: "mdi:police-badge"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "UNLESS YOU HAVE A WARRANT, WE DO NOT ANSWER THE DOOR"
    max_length: 120
    on_value:
      - script.execute: apply_special_mode
  - platform: template
    name: "Message - No Soliciting"
    id: no_soliciting_message
    icon: "mdi:cancel"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "NO SOLICITING"
    max_length: 120
    on_value:
      - script.execute: apply_special_mode
  - platform: template
    name: "Label - Police Mode"
    id: police_mode_label
    icon: "mdi:police-badge"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "POLICE MODE"
    max_length: 20
    on_value:
      - script.execute: apply_special_mode
  - platform: template
    name: "Label - No Soliciting"
    id: no_soliciting_label
    icon: "mdi:cancel"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "NO SOLICITING"
    max_length: 20
    on_value:
      - script.execute: apply_special_mode

datetime:
  - platform: template
    type: time
    name: "Available From"
    id: available_from
    icon: "mdi:clock-start"
    optimistic: true
    restore_value: true
    initial_value: "09:00:00"
    on_value:
      - lambda: |-
          ESP_LOGI("schedule", "Available From changed to %02d:%02d", id(available_from).hour, id(available_from).minute);
      - script.execute: apply_availability_status
  - platform: template
    type: time
    name: "Available Until"
    id: available_until
    icon: "mdi:clock-end"
    optimistic: true
    restore_value: true
    initial_value: "22:00:00"
    on_value:
      - lambda: |-
          ESP_LOGI("schedule", "Available Until changed to %02d:%02d", id(available_until).hour, id(available_until).minute);
      - script.execute: apply_availability_status

select:
  - platform: template
    name: "Screen Rotation"
    id: screen_rotation_select
    icon: "mdi:screen-rotation"
    entity_category: CONFIG
    optimistic: true
    restore_value: true
    initial_option: "0°"
    options:
      - "0°"
      - "90°"
      - "180°"
      - "270°"
    set_action:
      - script.execute:
          id: apply_screen_rotation
          rotation: !lambda |-
            if (x == "90°") return 90;
            if (x == "180°") return 180;
            if (x == "270°") return 270;
            return 0;

switch:
  - platform: template
    name: "Speaker Mute"
    id: speaker_mute
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - audio_dac.mute_on: es8311_dac
      - lvgl.widget.update:
          id: mute_switch
          state:
            checked: true
    turn_off_action:
      - audio_dac.mute_off: es8311_dac
      - lvgl.widget.update:
          id: mute_switch
          state:
            checked: false
  - platform: template
    name: "Do Not Disturb"
    id: dnd_switch
    icon: "mdi:bell-cancel-outline"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - globals.set:
          id: dnd_enabled
          value: 'true'
      - lambda: |-
          lv_obj_add_flag(id(doorbell_icon_btn), LV_OBJ_FLAG_HIDDEN);
    turn_off_action:
      - globals.set:
          id: dnd_enabled
          value: 'false'
      - lambda: |-
          lv_obj_clear_flag(id(doorbell_icon_btn), LV_OBJ_FLAG_HIDDEN);
  - platform: template
    name: "Police Mode"
    id: police_mode_switch
    icon: "mdi:police-badge"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - if:
          condition:
            switch.is_on: no_soliciting_switch
          then:
            - switch.turn_off: no_soliciting_switch
      - globals.set:
          id: police_mode_enabled
          value: 'true'
      - script.execute: apply_special_mode
    turn_off_action:
      - globals.set:
          id: police_mode_enabled
          value: 'false'
      - script.execute: apply_special_mode
  - platform: template
    name: "No Soliciting Mode"
    id: no_soliciting_switch
    icon: "mdi:cancel"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - if:
          condition:
            switch.is_on: police_mode_switch
          then:
            - switch.turn_off: police_mode_switch
      - globals.set:
          id: no_soliciting_enabled
          value: 'true'
      - script.execute: apply_special_mode
    turn_off_action:
      - globals.set:
          id: no_soliciting_enabled
          value: 'false'
      - script.execute: apply_special_mode
  - platform: template
    name: "Intercom Auto Answer"
    id: voip_auto_answer
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - globals.set:
          id: auto_answer_enabled
          value: 'true'
      - lvgl.widget.update:
          id: auto_answer_switch
          state:
            checked: true
    turn_off_action:
      - globals.set:
          id: auto_answer_enabled
          value: 'false'
      - lvgl.widget.update:
          id: auto_answer_switch
          state:
            checked: false
  - platform: gpio
    id: speaker_enable
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_ON
