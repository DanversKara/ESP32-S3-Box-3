            height: 32
            radius: 8
            bg_color: 0x1F2632
            widgets:
              - label: { text: "-", align: CENTER, text_font: font_large_bold, text_color: 0xFFFFFF }
            on_click:
              - lambda: |-
                  int v = id(volume_percent) - 5;
                  if (v < 0) v = 0;
                  id(volume_percent) = v;
              - audio_dac.set_volume:
                  id: es8311_dac
                  volume: !lambda 'return id(volume_percent) / 100.0;'
              - lambda: |-
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%d%%", id(volume_percent));
                  lv_label_set_text(id(incall_speaker_vol_label), buf);
                  lv_label_set_text(id(volume_percent_label), buf);
        - label:
            id: incall_speaker_vol_label
            text: "85%"
            text_font: font_small
            text_color: 0xFFFFFF
            x: 206
            y: 16
        - button:
            id: incall_speaker_up_btn
            x: 254
            y: 6
            width: 34
            height: 32
            radius: 8
            bg_color: 0x1F2632
            widgets:
              - label: { text: "+", align: CENTER, text_font: font_large_bold, text_color: 0xFFFFFF }
            on_click:
              - lambda: |-
                  int v = id(volume_percent) + 5;
                  if (v > 100) v = 100;
                  id(volume_percent) = v;
              - audio_dac.set_volume:
                  id: es8311_dac
                  volume: !lambda 'return id(volume_percent) / 100.0;'
              - lambda: |-
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%d%%", id(volume_percent));
                  lv_label_set_text(id(incall_speaker_vol_label), buf);
                  lv_label_set_text(id(volume_percent_label), buf);
        - label:
