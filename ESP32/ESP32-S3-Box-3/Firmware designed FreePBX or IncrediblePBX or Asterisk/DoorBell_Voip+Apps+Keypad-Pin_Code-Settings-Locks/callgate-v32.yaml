            text: "8\n3\n1\n7\n2\n5\n0\n9\n4\n6\n8\n3\n1\n7\n2\n5"
            text_font: font_small
            text_color: 0x00CC55
            x: 306
            y: -100
        - button:
            id: doorbell_full_screen_btn
            x: 0
            y: 0
            width: 100%
            height: 100%
            radius: 0
            bg_opa: TRANSP
            shadow_width: 0
            border_width: 0
            on_click:
              - script.execute: doorbell_press
        - button:
            id: doorbell_icon_btn
            align: CENTER
            y: -16
            width: 150
            height: 150
            radius: 75
            bg_color: 0xE74C3C
            shadow_width: 26
            shadow_spread: 6
            shadow_color: 0xE74C3C
            shadow_opa: 51%
            widgets:
              # Bell icon back to its normal (unscaled) size and centered
              # position - it's purely a dimmed background watermark again
              # now that the text sitting on top of it is just two short
              # words instead of the APT/unit caption.
              - label:
                  id: doorbell_icon_label
                  text: "\uF0F3"
                  align: CENTER
                  text_font: montserrat_48
                  text_color: 0x000000
                  text_opa: 35%
              # Static "PRESS / ENTER" caption, bold white, layered on top
              # of the dimmed bell icon (this is where APT/666 used to be).
              - label:
                  id: doorbell_press_label
                  text: "PRESS"
                  align: CENTER
                  y: -18
                  text_font: font_medium_bold
                  text_color: 0xFFFFFF
              - label:
                  id: doorbell_enter_label
                  text: "HERE"
                  align: CENTER
                  y: 14
                  text_font: font_medium_bold
                  text_color: 0xFFFFFF
            on_click:
              - script.execute: doorbell_press
        # Dark backing panel so the caption stays readable over the
        # moving rain columns behind it. Pushed further down than before
        # so it clears the bottom edge of the button instead of
        # overlapping it.
        - obj:
            id: doorbell_caption_backing
            align: CENTER
            y: 82
            width: 90%
            height: 34
            radius: 8
            bg_color: 0x000000
            bg_opa: 55%
            border_width: 0
        # "APT 666" caption - this is where "PRESS HERE" used to sit;
        # it swapped places with the PRESS/ENTER text now shown on the
        # button itself. Editable from HA (Devices & Services > this
        # device > "Caption - Apt/Unit"); the text below is just the
        # compiled-in default shown before HA connects/restores it.
        - label:
            id: doorbell_caption_label
            text: "APT 666"
            text_font: font_medium_bold
            text_color: 0xFFFFFF
            text_align: CENTER
            align: CENTER
            width: 94%
            y: 86
        # "DOOR BELL" label + down arrow - top-left corner, pointing
        # attention down toward the press button/icon below.
        - label:
            id: doorbell_topleft_label
            text: "DOOR BELL"
            text_font: font_medium_bold
            text_color: 0xFFFFFF
            align: TOP_LEFT
            x: 10
            y: 8
        # Small bell glyph tacked on right after the "DOOR BELL" text.
        # font_medium_bold is a custom Roboto font with no icon glyphs, so
        # this has to be its own label in a built-in montserrat font
        # (which does carry the FontAwesome symbol set) rather than
        # appended inline into the text above.
        - label:
            id: doorbell_topleft_bell_icon
            text: "\uF0F3"
            text_font: montserrat_24
            text_color: 0xFFFFFF
            align: TOP_LEFT
            x: 145
            y: 8
        - label:
            id: doorbell_topleft_arrow
            text: "\uF078"
            text_font: montserrat_24
            text_color: 0xFFFFFF
            align: TOP_LEFT
            x: 145
            y: 40
        # Available/after-hours status banner - background, border, and
        # text all update via apply_availability_status (see script:
        # above), driven by the Available From/Until times and the two
        # custom messages, all editable from Home Assistant. Percentage
        # width + BOTTOM_MID align means it fits landscape or portrait
        # on its own, with no per-rotation coordinates needed. Bottom
        # edge sits near the screen bottom (like before); height is
        # stretched to fill the space up toward the Caption box above
        # it, leaving a small gap so the two don't touch.
        - obj:
            id: availability_banner
            align: BOTTOM_MID
            y: -6
            width: 92%
            height: 70
            radius: 8
            bg_color: 0x123D22
            bg_opa: 92%
            border_width: 2
            border_color: 0x2ECC71
            widgets:
              - label:
                  id: availability_banner_label
                  text: "We're here — ring the bell!"
                  text_font: font_small
                  text_color: 0xFFFFFF
                  text_align: CENTER
                  align: CENTER
                  width: 92%
        - button:
            id: settings_btn
            align: TOP_RIGHT
            x: -10
            y: 8
            width: 56
            height: 56
            radius: 28
            bg_color: 0xFFFFFF
            bg_opa: COVER
            shadow_width: 0
            widgets:
              # Looks like a plain door-lock status icon to anyone glancing
              # at it. Its glyph/color are driven by apply_door_lock_icon
              # (see script:), based on binary_sensor.door_alarm_door - it
              # starts as a neutral gray closed-lock until the first state
              # arrives from Home Assistant after boot. Sized up (56px,
              # from 44px) and on a solid white circle so it's easier to
              # hit and see against the dark home page background.
              - label:
                  id: settings_icon_label
                  text: "\uE897"
                  align: CENTER
                  text_font: font_icon_lock_state
                  text_color: 0xB7C0CC
            # Tap behavior now depends on tap count AND door lock status:
            #   - Double tap (2nd tap within 350ms) -> ALWAYS opens the
            #     settings PIN pad, no matter what the door status is.
            #   - Single tap while locked/closed (green) -> also opens the
            #     settings PIN pad (same as the icon always used to do).
            #   - Single tap while unlocked/open (red) -> toggles the door
            #     lock script directly, no PIN pad involved.
            # The single-tap outcome is decided inside
            # lock_icon_single_tap_action, which fires after a short delay
            # so a following second tap has a chance to cancel it and
            # promote the interaction to a double tap instead.
            on_click:
              - lambda: |-
                  uint32_t now = millis();
                  id(lock_icon_last_tap_is_double) = (now - id(lock_icon_last_tap_ms) < 350);
                  id(lock_icon_last_tap_ms) = now;
                  ESP_LOGI("lock_icon", "tap: double=%s door_alarm_door.state=%s",
                           id(lock_icon_last_tap_is_double) ? "true" : "false",
                           id(door_alarm_door).state ? "true (open/unlocked)" : "false (closed/locked)");
              - if:
                  condition:
                    lambda: 'return id(lock_icon_last_tap_is_double);'
                  then:
                    - script.stop: lock_icon_single_tap_action
                    - globals.set:
                        id: lock_icon_last_tap_ms
                        value: '0'
                    - globals.set:
                        id: pin_buffer
                        value: '""'
                    - globals.set:
                        id: current_page
                        value: '"settings_pin"'
                    - lambda: 'lv_label_set_text(id(settings_pin_display), "");'
                    - lvgl.page.show: settings_pin_page
                  else:
                    - script.execute: lock_icon_single_tap_action
        # Flashing "return to call" badge - hidden unless a call is in
        # progress. Sits above the settings gear so it's always reachable.
        - button:
            id: call_return_btn
            align: TOP_RIGHT
            x: -8
            y: 72
            width: 44
            height: 44
            radius: 22
            bg_color: 0xFFC107
            border_width: 0
            shadow_width: 20
            shadow_spread: 4
            shadow_ofs_x: 0
            shadow_ofs_y: 0
            shadow_color: 0xFFD65C
            shadow_opa: COVER
            hidden: true
            widgets:
              - label:
                  text: "\uF095"
                  align: CENTER
                  text_font: montserrat_18
                  text_color: 0x241700
            on_click:
              - globals.set:
                  id: current_page
                  value: '"incall"'
              - lvgl.page.show: incall_page
        # Full-screen "unavailable" overlay - hidden while HA is connected,
        # shown (and blinked by the interval above) whenever it drops.
        - obj:
            id: doorbell_unavailable_overlay
            x: 0
            y: 0
            width: 100%
            height: 100%
            radius: 0
            bg_color: 0x000000
            bg_opa: COVER
            border_width: 0
            pad_all: 20
            hidden: true
            widgets:
              - label:
                  id: doorbell_unavailable_label
                  text: "DOOR BELL\nUNAVAILABLE\nAT THIS TIME"
                  text_font: font_medium_bold
                  text_color: 0xE74C3C
                  text_align: CENTER
                  align: CENTER
        # Full-screen "stolen" takeover - hidden while Wi-Fi is up, shown
        # (and kept on top of the HA-unavailable overlay above, since it's
        # declared after it here) the instant the link drops. White
        # background, bold red text, word-wrapped and width-constrained so
        # it fits the panel cleanly in every rotation (0/90/180/270)
        # without any per-rotation coordinates needed.
        - obj:
            id: stolen_overlay
            x: 0
            y: 0
            width: 100%
            height: 100%
            radius: 0
            bg_color: 0xFFFFFF
            bg_opa: COVER
            border_width: 0
            pad_all: 16
            hidden: true
            widgets:
              - label:
                  id: stolen_overlay_label
                  text: "HELP I BEEN STOLEN\nRETURN TO\nPO BOX 1357\nLINDSAY, CA 93247"
                  text_font: font_medium_bold
                  text_color: 0xFF0000
                  text_align: CENTER
                  align: CENTER
                  width: 92%
                  long_mode: WRAP

