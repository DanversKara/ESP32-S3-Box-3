    - id: incall_page
      bg_color: 0x000000
      widgets:
        - label:
            text: "VOLUME:"
            text_font: font_medium_bold
            text_color: 0xFFFFFF
            x: 8
            y: 14
        - button:
            id: incall_speaker_down_btn
            x: 165
            y: 6
