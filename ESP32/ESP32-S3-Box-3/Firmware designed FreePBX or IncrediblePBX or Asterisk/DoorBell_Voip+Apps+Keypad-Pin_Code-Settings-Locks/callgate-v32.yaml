            text_font: font_medium_bold
            text_color: 0xFFFFFF
            x: 8
            y: 56
        - button:
            id: incall_mic_down_btn
            x: 165
            y: 48
            width: 34
            height: 32
            radius: 8
            bg_color: 0x1F2632
            widgets:
              - label: { text: "-", align: CENTER, text_font: font_large_bold, text_color: 0xFFFFFF }
            on_click:
              - lambda: |-
                  float g = id(mic_gain_db) - 3.0;
                  if (g < 0.0) g = 0.0;
                  id(mic_gain_db) = g;
              - audio_adc.set_mic_gain:
                  id: es7210_adc
                  mic_gain: !lambda 'return id(mic_gain_db);'
              - lambda: |-
                  char buf[12];
                  snprintf(buf, sizeof(buf), "%.1fdB", id(mic_gain_db));
                  lv_label_set_text(id(incall_mic_gain_label), buf);
                  lv_label_set_text(id(mic_gain_label), buf);
        - label:
            id: incall_mic_gain_label
            text: "24.0dB"
            text_font: font_small
            text_color: 0xFFFFFF
            x: 206
            y: 58
        - button:
            id: incall_mic_up_btn
            x: 254
            y: 48
            width: 34
            height: 32
            radius: 8
            bg_color: 0x1F2632
            widgets:
              - label: { text: "+", align: CENTER, text_font: font_large_bold, text_color: 0xFFFFFF }
            on_click:
              - lambda: |-
                  float g = id(mic_gain_db) + 3.0;
                  if (g > 37.5) g = 37.5;
                  id(mic_gain_db) = g;
              - audio_adc.set_mic_gain:
                  id: es7210_adc
                  mic_gain: !lambda 'return id(mic_gain_db);'
              - lambda: |-
                  char buf[12];
                  snprintf(buf, sizeof(buf), "%.1fdB", id(mic_gain_db));
                  lv_label_set_text(id(incall_mic_gain_label), buf);
                  lv_label_set_text(id(mic_gain_label), buf);
        - label:
            id: call_timer_label
            text: "00:00"
            text_font: font_clock_bold
            text_color: 0xFFC107
            align: TOP_MID
            y: 92
        - label:
            id: incall_status_label
            text: "RINGING..."
            text_font: font_medium_bold
            text_color: 0xFFC107
            align: TOP_MID
            y: 150
        - button:
            id: answer_btn
            x: 0
            y: 196
            width: 320
            height: 44
            radius: 0
            bg_color: 0x2ECC71
            widgets:
              - label:
                  id: answer_btn_label
                  text: "ANSWER"
                  align: CENTER
                  text_font: font_medium_bold
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  # Once connected, or while we're the one dialing out
                  # (call_is_outgoing - including the doorbell's own ring),
                  # this button always hangs up/cancels. It only answers
                  # when we're on the receiving end of a still-ringing
                  # incoming call.
                  condition:
                    lambda: 'return id(call_active) || id(call_is_outgoing);'
                  then:
                    - sip_client.hangup: phone
                  else:
                    - sip_client.answer: phone

