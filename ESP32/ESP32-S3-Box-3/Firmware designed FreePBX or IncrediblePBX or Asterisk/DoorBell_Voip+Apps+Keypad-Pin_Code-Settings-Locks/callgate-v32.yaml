            y: 128
            width: 50
            height: 30
            radius: 8
            bg_color: 0x1F2632
            widgets:
              - label: { text: "-", align: CENTER, text_font: font_medium }
            on_click:
              - lambda: |-
                  int v = id(volume_percent) - 5;
                  if (v < 0) v = 0;
                  id(volume_percent) = v;
              - audio_dac.set_volume:
                  id: es8311_dac
                  volume: !lambda 'return id(volume_percent) / 100.0;'
              - lambda: |-
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%d%%", id(volume_percent));
                  lv_label_set_text(id(volume_percent_label), buf);
        - label:
            id: volume_percent_label
            text: "70%"
            text_font: font_medium
            text_color: 0xFFFFFF
            align: TOP_MID
            x: 0
            y: 132
        - button:
            id: volume_up_btn
            x: 256
            y: 128
            width: 50
            height: 30
            radius: 8
            bg_color: 0x1F2632
            widgets:
              - label: { text: "+", align: CENTER, text_font: font_medium }
            on_click:
              - lambda: |-
                  int v = id(volume_percent) + 5;
                  if (v > 100) v = 100;
                  id(volume_percent) = v;
              - audio_dac.set_volume:
                  id: es8311_dac
                  volume: !lambda 'return id(volume_percent) / 100.0;'
              - lambda: |-
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%d%%", id(volume_percent));
                  lv_label_set_text(id(volume_percent_label), buf);
        - label:
            text: "Mic Gain"
            text_font: font_small
            text_color: 0xB7C0CC
            x: 14
            y: 168
        - button:
            id: mic_gain_down_btn
            x: 14
            y: 186
            width: 50
            height: 30
            radius: 8
            bg_color: 0x1F2632
            widgets:
              - label: { text: "-", align: CENTER, text_font: font_medium }
            on_click:
              - lambda: |-
                  float g = id(mic_gain_db) - 3.0;
                  if (g < 0.0) g = 0.0;
                  id(mic_gain_db) = g;
              - audio_adc.set_mic_gain:
                  id: es7210_adc
                  mic_gain: !lambda 'return id(mic_gain_db);'
              - lambda: |-
                  char buf[12];
                  snprintf(buf, sizeof(buf), "%.1fdB", id(mic_gain_db));
                  lv_label_set_text(id(mic_gain_label), buf);
                  lv_label_set_text(id(incall_mic_gain_label), buf);
        - label:
            id: mic_gain_label
            text: "24.0dB"
            text_font: font_medium
            text_color: 0xFFFFFF
            align: TOP_MID
            x: 0
            y: 190
        - button:
            id: mic_gain_up_btn
            x: 256
            y: 186
            width: 50
            height: 30
            radius: 8
            bg_color: 0x1F2632
            widgets:
              - label: { text: "+", align: CENTER, text_font: font_medium }
            on_click:
              - lambda: |-
                  float g = id(mic_gain_db) + 3.0;
                  if (g > 37.5) g = 37.5;
                  id(mic_gain_db) = g;
              - audio_adc.set_mic_gain:
                  id: es7210_adc
                  mic_gain: !lambda 'return id(mic_gain_db);'
              - lambda: |-
                  char buf[12];
                  snprintf(buf, sizeof(buf), "%.1fdB", id(mic_gain_db));
                  lv_label_set_text(id(mic_gain_label), buf);
                  lv_label_set_text(id(incall_mic_gain_label), buf);

    # ------------------------------------------------------------------
    # LCD BRIGHTNESS PAGE — opened from Settings > "LCD Brightness"
    # ------------------------------------------------------------------
    - id: lcd_brightness_page
      bg_color: 0x11151C
      widgets:
        - label:
            text: "LCD Brightness"
            text_font: font_medium
            text_color: 0xFFFFFF
            align: TOP_MID
            y: 10
        - slider:
            id: lcd_brightness_slider
            x: 10
            y: 100
            width: 300
            height: 16
            min_value: 10
            max_value: 100
            value: 100
            bg_color: 0x1F2632
            indicator:
              bg_color: 0xE67E22
            knob:
              bg_color: 0xFFFFFF
            on_release:
              - light.turn_on:
                  id: led
                  brightness: !lambda 'return x / 100.0;'
        - button:
            id: back_from_lcd_brightness_btn
            align: CENTER
            y: 150
            width: 150
            height: 36
            radius: 10
            bg_color: 0x1F2632
            widgets:
              - label: { text: "Back", align: CENTER, text_font: font_small, text_color: 0xFFFFFF }
            on_click:
              - globals.set:
                  id: current_page
                  value: '"settings"'
              - lvgl.page.show: settings_page

text:
  #── "APT 666" caption box under the doorbell button, editable from Home
  #   Assistant under this device's entities (Devices & Services > this
  #   device). Updates the home page label live (on_value below) and is
  #   re-applied on boot once HA reconnects (see api > on_client_connected).
  - platform: template
    name: "Caption - Apt/Unit"
    id: door_caption_message
    icon: "mdi:card-text-outline"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "APT 666"
    max_length: 20
    on_value:
      - lambda: |-
          lv_label_set_text(id(doorbell_caption_label), id(door_caption_message).state.c_str());
  #── Custom availability messages, editable from Home Assistant under
  #   this device's entities (Devices & Services > this device). Whichever
  #   one is active - based on the Available From/Until times below - is
  #   shown on the home page banner, which also recolors to match.
  - platform: template
    name: "Message - Available"
    id: available_message
    icon: "mdi:message-text"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "We're here — ring the bell!"
    max_length: 40
    on_value:
      - script.execute: apply_availability_status
  - platform: template
    name: "Message - After Hours"
    id: unavailable_message
    icon: "mdi:message-text-outline"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "We're away right now. Please leave a message."
    max_length: 60
    on_value:
      - script.execute: apply_availability_status

datetime:
  #── "Available" window - outside these hours the home page banner
  #   switches to the after-hours message/colors above. Both editable
  #   from HA; a window that wraps past midnight is handled fine (see
  #   apply_availability_status).
  - platform: template
    type: time
    name: "Available From"
    id: available_from
    icon: "mdi:clock-start"
    optimistic: true
    restore_value: true
    initial_value: "09:00:00"
    on_value:
      - lambda: |-
          ESP_LOGI("schedule", "Available From changed to %02d:%02d", id(available_from).hour, id(available_from).minute);
      - script.execute: apply_availability_status
  - platform: template
    type: time
    name: "Available Until"
    id: available_until
    icon: "mdi:clock-end"
    optimistic: true
    restore_value: true
    initial_value: "22:00:00"
    on_value:
      - lambda: |-
          ESP_LOGI("schedule", "Available Until changed to %02d:%02d", id(available_until).hour, id(available_until).minute);
      - script.execute: apply_availability_status

select:
  - platform: template
    name: "Screen Rotation"
    id: screen_rotation_select
    icon: "mdi:screen-rotation"
    entity_category: CONFIG
    optimistic: true
    restore_value: true
    initial_option: "0°"
    options:
      - "0°"
      - "90°"
      - "180°"
      - "270°"
    set_action:
      - script.execute:
          id: apply_screen_rotation
          rotation: !lambda |-
            if (x == "90°") return 90;
            if (x == "180°") return 180;
            if (x == "270°") return 270;
            return 0;

switch:
  - platform: template
    name: "Speaker Mute"
    id: speaker_mute
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - audio_dac.mute_on: es8311_dac
      - lvgl.widget.update:
          id: mute_switch
          state:
            checked: true
    turn_off_action:
      - audio_dac.mute_off: es8311_dac
      - lvgl.widget.update:
          id: mute_switch
          state:
            checked: false
  - platform: template
    name: "Do Not Disturb"
    id: dnd_switch
    icon: "mdi:bell-cancel-outline"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - globals.set:
          id: dnd_enabled
          value: 'true'
      - lambda: |-
          lv_obj_add_flag(id(doorbell_icon_btn), LV_OBJ_FLAG_HIDDEN);
    turn_off_action:
      - globals.set:
          id: dnd_enabled
          value: 'false'
      - lambda: |-
          lv_obj_clear_flag(id(doorbell_icon_btn), LV_OBJ_FLAG_HIDDEN);
  - platform: template
    name: "Intercom Auto Answer"
    id: voip_auto_answer
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - globals.set:
          id: auto_answer_enabled
          value: 'true'
      - lvgl.widget.update:
          id: auto_answer_switch
          state:
            checked: true
    turn_off_action:
      - globals.set:
          id: auto_answer_enabled
          value: 'false'
      - lvgl.widget.update:
          id: auto_answer_switch
          state:
            checked: false
  - platform: gpio
    id: speaker_enable
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_ON