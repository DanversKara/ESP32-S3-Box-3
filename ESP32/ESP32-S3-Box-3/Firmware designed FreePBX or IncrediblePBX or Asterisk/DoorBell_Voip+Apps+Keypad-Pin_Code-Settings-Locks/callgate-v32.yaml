            id: settings_pin_0
            x: 112
            y: 170
            width: 96
            height: 36
            radius: 10
            bg_color: 0xEDEDED
            widgets:
              - label: { text: "0", align: CENTER, text_font: font_medium, text_color: 0x11151C }
            on_click:
              - lambda: |-
                  id(pin_buffer) += "0";
                  lv_label_set_text(id(settings_pin_display), id(pin_buffer).c_str());
        - button:
            id: settings_pin_enter
            x: 214
            y: 170
            width: 96
            height: 36
            radius: 10
            bg_color: 0x2ECC71
            widgets:
              - label: { text: "ENTER", align: CENTER, text_font: font_small, text_color: 0xFFFFFF }
            on_click:
              - if:
                  condition:
                    lambda: 'return id(pin_buffer) == "${settings_pin}";'
                  then:
                    - globals.set:
                        id: pin_buffer
                        value: '""'
                    - globals.set:
                        id: current_page
                        value: '"settings"'
                    - script.execute: apply_dialpad_status
                    - lvgl.page.show: settings_page
                  else:
                    - if:
                        condition:
                          lambda: 'return id(pin_buffer) == "${door_pin}";'
                        then:
                          # door_pin operates entirely on its own - it never
                          # opens the settings menu, it just toggles the door
                          # lock script and drops straight back to the home
                          # page, exactly like a real door-lock keypad would.
                          - globals.set:
                              id: pin_buffer
                              value: '""'
                          - lambda: 'lv_label_set_text(id(settings_pin_display), "");'
                          - if:
                              condition:
                                api.connected: {}
                              then:
                                - homeassistant.service:
                                    service: script.turn_on
                                    data:
                                      entity_id: ${door_lock_script_entity}
                                    on_error:
                                      - logger.log:
                                          format: "HA service error (script.turn_on door lock via door_pin): %s"
                                          args: ["error.c_str()"]
                                          tag: ha_service
                              else:
                                - logger.log:
                                    format: "Skipped HA service call: no API connection"
                                    tag: ha_service
                          - globals.set:
                              id: current_page
                              value: '"home"'
                          - lvgl.page.show: home_page
                        else:
                          - globals.set:
                              id: pin_buffer
                              value: '""'
                          - lambda: 'lv_label_set_text(id(settings_pin_display), "Wrong PIN");'

