            id: matrix_col_0
            text: "3\n7\n1\n9\n4\n0\n8\n2\n6\n5\n1\n7\n3\n9\n0\n6"
            text_font: font_small
            text_color: 0x00CC55
            x: 2
            y: -260
        - label:
            id: matrix_col_1
            text: "8\n2\n5\n0\n7\n1\n4\n9\n3\n6\n2\n8\n5\n0\n1\n4"
            text_font: font_small
            text_color: 0x00CC55
            x: 30
            y: -40
        - label:
            id: matrix_col_2
            text: "1\n6\n9\n3\n0\n5\n8\n2\n4\n7\n1\n6\n9\n3\n0\n5"
            text_font: font_small
            text_color: 0x00CC55
            x: 58
            y: -180
        - label:
            id: matrix_col_3
            text: "4\n0\n7\n2\n9\n6\n1\n8\n5\n3\n4\n0\n7\n2\n9\n6"
            text_font: font_small
            text_color: 0x00CC55
            x: 86
            y: -300
        - label:
            id: matrix_col_4
            text: "9\n5\n2\n8\n1\n4\n0\n6\n3\n7\n9\n5\n2\n8\n1\n4"
            text_font: font_small
            text_color: 0x00CC55
            x: 114
            y: -10
        - label:
            id: matrix_col_5
            text: "0\n8\n4\n1\n6\n3\n9\n5\n2\n7\n0\n8\n4\n1\n6\n3"
            text_font: font_small
            text_color: 0x00CC55
            x: 142
            y: -220
        - label:
            id: matrix_col_6
            text: "6\n1\n3\n9\n5\n0\n7\n4\n8\n2\n6\n1\n3\n9\n5\n0"
            text_font: font_small
            text_color: 0x00CC55
            x: 170
            y: -60
        - label:
            id: matrix_col_7
            text: "2\n9\n6\n0\n3\n8\n5\n1\n7\n4\n2\n9\n6\n0\n3\n8"
            text_font: font_small
            text_color: 0x00CC55
            x: 198
            y: -260
        - label:
            id: matrix_col_8
            text: "7\n4\n0\n5\n8\n2\n6\n9\n1\n3\n7\n4\n0\n5\n8\n2"
            text_font: font_small
            text_color: 0x00CC55
            x: 226
            y: -120
        - label:
            id: matrix_col_9
            text: "5\n1\n8\n4\n0\n7\n2\n3\n9\n6\n5\n1\n8\n4\n0\n7"
            text_font: font_small
            text_color: 0x00CC55
            x: 254
            y: -20
        - label:
            id: matrix_col_10
            text: "3\n0\n6\n2\n9\n4\n1\n7\n5\n8\n3\n0\n6\n2\n9\n4"
            text_font: font_small
            text_color: 0x00CC55
            x: 282
            y: -200
        - label:
