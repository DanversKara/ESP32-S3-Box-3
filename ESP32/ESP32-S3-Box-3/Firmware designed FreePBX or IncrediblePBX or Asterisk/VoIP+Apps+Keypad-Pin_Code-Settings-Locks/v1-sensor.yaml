                  text: "\uF015"
                  align: LEFT_MID
                  x: 88
                  text_font: montserrat_18
                  text_color: 0xE74C3C
              - label:
                  id: wifi_status_icon
                  text: "\uF1EB"
                  align: LEFT_MID
                  x: 120
                  text_font: montserrat_18
