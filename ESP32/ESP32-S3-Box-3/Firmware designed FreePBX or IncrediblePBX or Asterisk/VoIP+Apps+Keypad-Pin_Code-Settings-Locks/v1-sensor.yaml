        - obj:
            id: battery_status_group
            align: BOTTOM_RIGHT
            x: -6
            y: -2
            width: 64
            height: 24
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            widgets:
              - label:
                  id: battery_icon_label
                  text: "\uF240"
                  align: LEFT_MID
                  x: 0
                  text_font: montserrat_18
                  text_color: 0xFFFFFF
              - label:
                  id: battery_status_label
                  text: "--"
                  align: LEFT_MID
                  x: 26
                  text_font: font_small
