                    api.connected: {}
                  then:
                    - homeassistant.service:
                        service: light.turn_on
                        data:
                          entity_id: ${light_widget_entity}
                          color_temp_kelvin: "4000"
                          brightness_pct: "100"
                        on_error:
                          - logger.log:
                              format: "HA service error (light.turn_on daylight): %s"
                              args: ["error.c_str()"]
                              tag: ha_service
                    - lvgl.slider.update:
                        id: light_temp_slider
                        value: 4000
                    - lvgl.slider.update:
                        id: light_brightness_slider
                        value: 100
                  else:
                    - logger.log:
                        format: "Skipped HA service call: no API connection"
                        tag: ha_service
        - label:
            text: "Brightness"
            text_font: font_small
            text_color: 0xB7C0CC
            x: 12
            y: 112
