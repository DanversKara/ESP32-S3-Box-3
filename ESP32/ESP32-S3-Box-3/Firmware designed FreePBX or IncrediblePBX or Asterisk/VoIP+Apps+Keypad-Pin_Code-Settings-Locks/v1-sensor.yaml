            height: 32
            radius: 10
            bg_color: 0x2ECC71
            widgets:
              - label: { text: "Enter", align: CENTER, text_font: font_small }
            on_click:
              - if:
                  condition:
                    lambda: 'return id(pin_buffer) == "${door_pin}";'
                  then:
                    - globals.set:
                        id: pin_buffer
                        value: '""'
                    - globals.set:
                        id: current_page
                        value: '"home"'
                    - lvgl.page.show: home_page
                    - if:
                        condition:
                          api.connected: {}
                        then:
                          - if:
                              condition:
                                lambda: 'return id(front_door_lock_state).state == "locked";'
                              then:
                                - homeassistant.service:
                                    service: lock.unlock
                                    data:
                                      entity_id: lock.living_room_front_door_lock
                                    on_error:
                                      - logger.log:
                                          format: "HA service error (lock.unlock via PIN): %s"
                                          args: ["error.c_str()"]
                                          tag: ha_service
                              else:
                                - homeassistant.service:
                                    service: lock.lock
                                    data:
                                      entity_id: lock.living_room_front_door_lock
                                    on_error:
                                      - logger.log:
                                          format: "HA service error (lock.lock via PIN): %s"
                                          args: ["error.c_str()"]
                                          tag: ha_service
                        else:
                          - logger.log:
                              format: "Skipped HA service call: no API connection"
                              tag: ha_service
                  else:
                    - globals.set:
                        id: pin_buffer
                        value: '""'
                    - lambda: 'lv_label_set_text(id(door_pin_display), "Wrong PIN");'

