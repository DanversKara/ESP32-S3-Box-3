              - lvgl.page.show: incall_page
              - sip_client.call:
                  id: phone
                  number: !lambda 'return id(speed_dial_4_number).state;'
        - obj:
            id: phone_status_group
            align: BOTTOM_LEFT
            x: 6
            y: -2
            width: 172
            height: 24
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            widgets:
              # Phone connector icon - doubles as the SIP connection status
              # (green = registered, red = no connection) AND the busy
              # indicator (amber "line through the phone" while ringing,
              # dialing, or on a call). Driven entirely by the
              # update_status_icons script - see its comments for the
              # exact color/state logic and its caveats.
              - label:
                  id: phone_icon_label
                  text: "\uF095"
                  align: LEFT_MID
                  x: 0
                  text_font: montserrat_18
                  text_color: 0xE74C3C
              # Mic-in-use icon - red while a call is live (mic audio is
              # actually being sent), green otherwise. Uses the built-in
              # LVGL "volume" glyph since the bundled montserrat_18 icon
              # font has no dedicated microphone symbol.
              - label:
                  id: mic_status_icon
                  text: "\uF028"
                  align: LEFT_MID
                  x: 28
                  text_font: montserrat_18
                  text_color: 0x2ECC71
              # Auto-answer icon - green off, red on-and-a-call-is-live,
              # orange on-but-idle/armed. Uses the "loop" glyph as a stand-in
              # for "auto".
              - label:
                  id: auto_answer_status_icon
                  text: "\uF079"
                  align: LEFT_MID
                  x: 56
                  text_font: montserrat_18
                  text_color: 0x2ECC71
              - label:
