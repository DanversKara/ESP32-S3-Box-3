            widgets:
              - label:
                  text: "EXIT"
                  align: CENTER
                  text_font: font_small
                  text_color: 0xFFFFFF
            on_click:
              - globals.set:
                  id: current_page
                  value: '"apps"'
              - lvgl.page.show: apps_page
        - button:
            id: light_power_btn
            x: 12
            y: 54
            width: 90
            height: 46
            radius: 8
            bg_color: 0x1F2632
            widgets:
              - label:
                  text: "POWER"
                  align: CENTER
                  text_font: font_small
                  text_color: 0xFFCC00
            on_click:
              - if:
                  condition:
                    api.connected: {}
                  then:
                    - homeassistant.service:
                        service: light.toggle
                        data:
                          entity_id: ${light_widget_entity}
                        on_error:
                          - logger.log:
                              format: "HA service error (light.toggle): %s"
                              args: ["error.c_str()"]
                              tag: ha_service
                  else:
                    - logger.log:
                        format: "Skipped HA service call: no API connection"
                        tag: ha_service
        - button:
            id: daylight_reset_btn
            x: 218
            y: 54
            width: 90
            height: 46
            radius: 8
            bg_color: 0x1F2632
            widgets:
              - label:
                  text: "Daylight"
                  align: CENTER
                  text_font: font_small
                  text_color: 0xFFEE88
            on_click:
              - if:
