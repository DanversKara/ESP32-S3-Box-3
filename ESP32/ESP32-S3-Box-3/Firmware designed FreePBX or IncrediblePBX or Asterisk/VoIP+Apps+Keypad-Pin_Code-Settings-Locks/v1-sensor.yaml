        # Flashing "return to call" badge - hidden unless a call is in
        # progress (the 500ms interval above shows/hides it and pulses
        # the amber bg_color + shadow to make it glow, like the light's
        # coming from behind the icon rather than a flat blink). Sits in
        # the bottom-right corner, right above the battery indicator.
        # Tapping it jumps straight back to the in-call page, so you can
        # hop away to use the rest of the app mid-call and still find
