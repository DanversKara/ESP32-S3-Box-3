              - lvgl.page.show: incall_page
              - sip_client.call:
                  id: phone
                  number: !lambda 'return id(speed_dial_3_number).state;'
        - button:
            id: speed_dial_4_btn
            align: BOTTOM_LEFT
            x: 156
            y: -30
            width: 50
            height: 20
            radius: 4
            bg_color: 0x1F2632
            shadow_width: 0
            widgets:
              - label:
                  id: speed_dial_4_label_widget
