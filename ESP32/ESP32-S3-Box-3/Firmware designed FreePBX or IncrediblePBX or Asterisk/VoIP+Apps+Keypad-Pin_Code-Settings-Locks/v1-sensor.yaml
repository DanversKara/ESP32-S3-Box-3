switch:
  #── IR device mirrors — ported from old.yaml's sw_menu_* pattern. Each
  # mirrors the real HA switch: switch.toggle sends the command, and
  # on_turn_on/on_turn_off recolor the IR page button to match whatever
  # actually changed the state (button, remote, automation). ──
  - platform: homeassistant
    id: sw_menu_fan
    entity_id: ${menu_fan_entity}
    internal: true
    on_turn_on:
      lambda: |-
        lv_obj_set_style_bg_color(id(fan_btn), lv_color_hex(0x3D7BFF), 0);
    on_turn_off:
      lambda: |-
        lv_obj_set_style_bg_color(id(fan_btn), lv_color_hex(0x1F2632), 0);
  - platform: homeassistant
    id: sw_menu_soundbar
    entity_id: ${menu_soundbar_entity}
    internal: true
    on_turn_on:
      lambda: |-
        lv_obj_set_style_bg_color(id(soundbar_btn), lv_color_hex(0x3D7BFF), 0);
    on_turn_off:
      lambda: |-
        lv_obj_set_style_bg_color(id(soundbar_btn), lv_color_hex(0x1F2632), 0);
  - platform: template
    name: "Speaker Mute"
    id: speaker_mute
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - audio_dac.mute_on: es8311_dac
      - lvgl.widget.update:
          id: mute_switch
          state:
            checked: true
    turn_off_action:
      - audio_dac.mute_off: es8311_dac
      - lvgl.widget.update:
          id: mute_switch
          state:
            checked: false
  - platform: template
    name: "Intercom Auto Answer"
    id: voip_auto_answer
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - globals.set:
          id: auto_answer_enabled
          value: 'true'
      - lvgl.widget.update:
          id: auto_answer_switch
          state:
            checked: true
      - script.execute: update_status_icons
    turn_off_action:
      - globals.set:
          id: auto_answer_enabled
          value: 'false'
      - lvgl.widget.update:
          id: auto_answer_switch
          state:
            checked: false
      - script.execute: update_status_icons
  - platform: template
    name: "Door Lock PIN Required"
    id: door_secure_mode_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - globals.set:
          id: door_secure_mode
          value: 'true'
      - lvgl.widget.update:
          id: door_secure_switch
          state:
            checked: true
    turn_off_action:
      - globals.set:
          id: door_secure_mode
          value: 'false'
      - lvgl.widget.update:
          id: door_secure_switch
          state:
            checked: false
  - platform: gpio
    id: speaker_enable
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_ON

text:
  # Editable from the ESPHome device page in HA, same as the switches above.
  # optimistic: true means the entity just stores/reports back whatever it's
  # set to - no lambda needed. restore_value: true keeps it across reboots.
  - platform: template
    name: "Speed Dial Office Number"
    id: speed_dial_office_number
    icon: "mdi:phone"
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    min_length: 0
    max_length: 32
    initial_value: "705"
  - platform: template
    name: "Speed Dial Office Label"
    id: speed_dial_office_label
    icon: "mdi:label-outline"
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    min_length: 0
    max_length: 12
    initial_value: "Office"
    on_value:
      - lvgl.label.update:
          id: speed_dial_office_label_widget
