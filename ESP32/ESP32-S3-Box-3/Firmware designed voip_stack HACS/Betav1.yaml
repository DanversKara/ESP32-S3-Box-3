    mode: text
    optimistic: true
    internal: true
    initial_value: ""

globals:
  - id: wifi_ok
    type: bool
    restore_value: false
    initial_value: "false"
  - id: ha_ok
    type: bool
    restore_value: false
    initial_value: "false"
  - id: call_ringing
    type: bool
    restore_value: false
    initial_value: "false"
  - id: call_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: current_page
    type: int
    restore_value: false
    initial_value: "0"   # 0 = home, 1 = dialer, 2 = settings
  # Mic gain in dB, applied to the ES7210 ADC. restore_value keeps whatever
  # level you settle on across reboots. Generic audio hardware setting —
  # not part of the VoIP call pipeline itself.
  - id: mic_gain_db
    type: float
    restore_value: true
    initial_value: "24.0"
  # Speaker volume, 0-100. Same idea — generic DAC volume control.
  - id: speaker_volume
    type: int
    restore_value: true
    initial_value: "80"

script:
  - id: place_call
    parameters:
      dest: string
    then:
      - voip_stack.call:
          id: phone
          target: !lambda 'return dest;'

