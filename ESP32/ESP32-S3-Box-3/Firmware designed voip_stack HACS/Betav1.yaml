    mode: text
    optimistic: true
    restore_value: true
    initial_value: "Living Room"

  - platform: template
    id: dial3_name
    name: "Speed Dial 3 Name"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "Front Door"
  - platform: template
    id: dial3_target
    name: "Speed Dial 3 Target"
    mode: text
    optimistic: true
