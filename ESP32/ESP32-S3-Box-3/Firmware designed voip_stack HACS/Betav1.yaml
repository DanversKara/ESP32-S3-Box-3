    # ---- new: Settings page (theme + mic gain / volume / backlight) ----
    - id: settings_screen
      bg_color: 0x11151C
      widgets:
        - label:
            text: "Settings"
            align: TOP_MID
            y: 4
            text_font: font_title
            text_color: 0xFFFFFF

        - label:
            text: "Auto-Answer"
            x: 10
            y: 34
            text_font: font_label
            text_color: 0xB7C0CC
        - switch:
            id: settings_auto_answer_switch
            x: 250
            y: 30
            on_click:
              - switch.toggle: auto_answer_switch

        - label:
            text: "Mute Speaker"
            x: 10
            y: 64
            text_font: font_label
            text_color: 0xB7C0CC
        - switch:
            id: settings_mute_switch
            x: 250
            y: 60
            on_click:
              - switch.toggle: speaker_mute

        - label:
            text: "Volume"
            x: 10
            y: 92
            text_font: font_label
            text_color: 0xB7C0CC
        - slider:
            id: volume_slider
            x: 10
            y: 110
            width: 300
            height: 16
            min_value: 0
            max_value: 100
            value: 80
            bg_color: 0x1F2632
            indicator:
              bg_color: 0x3D7BFF
            knob:
              bg_color: 0xFFFFFF
            on_release:
              - globals.set:
                  id: speaker_volume
                  value: !lambda 'return (int) x;'
              - audio_dac.set_volume:
                  id: es8311_dac
                  volume: !lambda 'return x / 100.0;'

        - label:
            text: "Backlight"
            x: 10
            y: 132
            text_font: font_label
            text_color: 0xB7C0CC
        - slider:
            id: brightness_slider
            x: 10
            y: 150
            width: 300
            height: 16
            min_value: 10
            max_value: 100
            value: 100
            bg_color: 0x1F2632
            indicator:
              bg_color: 0x3D7BFF
            knob:
              bg_color: 0xFFFFFF
            on_release:
              - light.turn_on:
                  id: led
                  brightness: !lambda 'return x / 100.0;'

        - label:
            text: "Mic Gain"
            x: 10
            y: 176
            text_font: font_label
            text_color: 0xB7C0CC
        - button:
            id: mic_gain_down_btn
            x: 10
            y: 194
            width: 60
            height: 32
            radius: 8
            bg_color: 0x1F2632
            widgets:
              - label: {text: "-", align: CENTER, text_font: font_label, text_color: 0xFFFFFF}
            on_click:
              - lambda: |-
                  float g = id(mic_gain_db) - 3.0;
                  if (g < 0.0) g = 0.0;
                  id(mic_gain_db) = g;
              - audio_adc.set_mic_gain:
                  id: es7210_adc
                  mic_gain: !lambda 'return id(mic_gain_db);'
              - lambda: |-
                  char buf[12];
                  snprintf(buf, sizeof(buf), "%.1fdB", id(mic_gain_db));
                  lv_label_set_text(id(mic_gain_label), buf);
        - label:
            id: mic_gain_label
            text: "24.0dB"
            align: TOP_MID
            y: 199
            text_font: font_label
            text_color: 0xFFFFFF
        - button:
            id: mic_gain_up_btn
            x: 250
            y: 194
            width: 60
            height: 32
            radius: 8
            bg_color: 0x1F2632
            widgets:
              - label: {text: "+", align: CENTER, text_font: font_label, text_color: 0xFFFFFF}
            on_click:
              - lambda: |-
                  float g = id(mic_gain_db) + 3.0;
                  if (g > 37.5) g = 37.5;
                  id(mic_gain_db) = g;
              - audio_adc.set_mic_gain:
                  id: es7210_adc
                  mic_gain: !lambda 'return id(mic_gain_db);'
              - lambda: |-
                  char buf[12];
                  snprintf(buf, sizeof(buf), "%.1fdB", id(mic_gain_db));
                  lv_label_set_text(id(mic_gain_label), buf);

        - button:
            id: back_from_settings_btn
            align: BOTTOM_MID
            y: -8
            width: 140
            height: 34
            radius: 10
            bg_color: 0x1F2632
            widgets:
              - label:
                  text: "Back"
                  align: CENTER
                  text_font: font_label
                  text_color: 0xFFFFFF
            on_click:
              - lambda: |-
                  id(current_page) = 0;
                  id(lvgl_comp)->show_page(id(home_screen)->index, LV_SCR_LOAD_ANIM_NONE, 0);

# ── Periodic UI refresh: clock + status row ─────────────────────────────
interval:
  - interval: 1s
    then:
      - lambda: |-
          char buf[6];
          auto t = id(ha_time).now();
          if (t.is_valid()) {
            snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
            lv_label_set_text(id(clock_label), buf);
          }

  - interval: 500ms
    then:
      - lambda: |-
          // Icon-based connection status row (same wifi_ok/ha_ok/call_active
          // logic as before, just drawn as colored icons instead of text).
          lv_obj_set_style_text_color(id(wifi_status_icon),
              id(wifi_ok) ? lv_color_hex(0x2ECC71) : lv_color_hex(0xE74C3C), 0);
          lv_obj_set_style_text_color(id(ha_status_icon),
              id(ha_ok) ? lv_color_hex(0x2ECC71) : lv_color_hex(0xE74C3C), 0);
          lv_obj_set_style_text_color(id(phone_status_icon),
              (id(wifi_ok) && id(ha_ok)) ? lv_color_hex(0x2ECC71) : lv_color_hex(0xE74C3C), 0);
          lv_obj_set_style_text_color(id(mic_status_icon),
              id(call_active) ? lv_color_hex(0xE74C3C) : lv_color_hex(0x2ECC71), 0);
          lv_label_set_text(id(label_autoanswer_status),
              id(auto_answer_switch).state ? "AA:ON" : "AA:OFF");
          lv_obj_set_style_text_color(id(label_autoanswer_status),
              id(auto_answer_switch).state ? lv_color_hex(0x2ECC71) : lv_color_hex(0x7A8699), 0);
          if (id(call_ringing)) {
            lv_label_set_text(id(label_call_status), "Ringing");
          } else if (id(call_active)) {
            lv_label_set_text(id(label_call_status), "In Call");
          } else {
            lv_label_set_text(id(label_call_status), "");
          }
          // Keep the Settings page switches reflecting the real entity state.
          if (id(auto_answer_switch).state) {
            lv_obj_add_state(id(settings_auto_answer_switch), LV_STATE_CHECKED);
          } else {
            lv_obj_clear_state(id(settings_auto_answer_switch), LV_STATE_CHECKED);
          }
          if (id(speaker_mute).state) {
            lv_obj_add_state(id(settings_mute_switch), LV_STATE_CHECKED);
          } else {
            lv_obj_clear_state(id(settings_mute_switch), LV_STATE_CHECKED);
          }

  # Keep speed-dial button labels + dialer buffer in sync live
  - interval: 2s
    then:
      - lambda: |-
          lv_label_set_text(id(dial1_btn_label), id(dial1_name).state.c_str());
          lv_label_set_text(id(dial2_btn_label), id(dial2_name).state.c_str());
          lv_label_set_text(id(dial3_btn_label), id(dial3_name).state.c_str());
          lv_label_set_text(id(dial4_btn_label), id(dial4_name).state.c_str());
          lv_label_set_text(id(dial5_btn_label), id(dial5_name).state.c_str());
          lv_label_set_text(id(dial6_btn_label), id(dial6_name).state.c_str());
          lv_label_set_text(id(dial_buffer_label), id(dial_buffer).state.c_str());
