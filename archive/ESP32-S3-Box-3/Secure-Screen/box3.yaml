        id: "Radar"

light:
  - platform: monochromatic
    id: led
    name: LCD Backlight
    entity_category: config
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 50ms
    on_turn_on:
      - lvgl.resume:
      - lvgl.widget.redraw:
    on_turn_off:
      - lvgl.pause:
          show_snow: true
      - delay: 60s
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.pause:
                show_snow: false

sensor:
  - platform: aht10
    i2c_id: bus_b
    variant: AHT20
    temperature:
      name: "S3 Temperature"
      filters:
        - lambda: |-
            return x + id(temp_offset_number).state;
      id: s3temp
      on_value:
        - delay: 15s
        - if:
            condition: 
              lambda: return !id(use_room_temp);
            then:
              - lvgl.widget.show: temp_label
    humidity:
      name: "S3 Humidity"
      id: s3humidity
      on_value:
        - delay: 15s
        - if:
            condition: 
              lambda: return !id(use_room_temp);
            then:
              - lvgl.widget.show: humidity_label
    update_interval: 30s

  - platform: adc
    pin: GPIO10
    id: battery_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: "voltage"
    entity_category: "diagnostic"
    disabled_by_default: true
    update_interval: 30s
    attenuation: auto
    filters:
      - multiply: 4.11

  - platform: copy
    id: battery_percent
    source_id: battery_voltage
    name: "Battery level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: "battery"
    entity_category: "diagnostic"
    filters:
      - lambda: return (x - 2.7) / (4.2 - 2.7) * 100;
      - clamp:
          min_value: 0
          max_value: 100
    on_value:
      - lvgl.label.update:
          id: lbl_battery
          text: !lambda |-
            char buf[10];
            sprintf(buf, "%.f%%", id(battery_percent).state);
            return buf;
      - if:
          condition:
              lambda: return (x > 0);
          then:
            - lvgl.widget.show: lbl_battery_status
            - lvgl.widget.show: lbl_battery_title
            - lvgl.widget.show: lbl_battery
          else:
            - lvgl.widget.hide: lbl_battery_status
            - lvgl.widget.hide: lbl_battery_title
            - lvgl.widget.hide: lbl_battery
      - lvgl.label.update:
          id: lbl_battery_status
          text: !lambda |-
            static char buf[10];
            sprintf(buf, "%.0f%%", id(battery_percent).state);
            return buf;
    
  - platform: uptime
    id: up_sens
    on_value:
      - lambda: |-
          int seconds = id(up_sens).state;
          int days = seconds / 86400;
          int hours = seconds / 3600;
          int minutes = (seconds % 3600) / 60;
          seconds %= 60;
          id(up_sens_text).publish_state(str_sprintf("%03d:%02d:%02d:%02d", days, hours, minutes, seconds));
    update_interval: 300s

  - platform: wifi_signal #requires WIFI
    name: "WiFi db"
    id: wifi_signal_db
    update_interval: 30s

  - platform: copy #requires WIFI
    source_id: wifi_signal_db
    name: "WiFi Signal"
    id: wifi_percent
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""
    on_value:
      - lvgl.label.update:
          id: lbl_ss
          text: !lambda |-
            char buf[10];
            sprintf(buf, "%.f%%", id(wifi_percent).state);
            return buf;

