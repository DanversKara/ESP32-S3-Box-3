                        text: ":"
                        text_font: my_font22
                        text_color: 0xFFFFFF
                        align: CENTER
                        text_align: CENTER
                        grid_cell_column_pos: 3
                        grid_cell_row_pos: 1
                        grid_cell_x_align: CENTER
                        grid_cell_y_align: CENTER
                    - roller:
                        id: timer_roller_seconds
                        width: 50
                        height: 70
                        align: CENTER
                        grid_cell_column_pos: 4
                        grid_cell_row_pos: 1
                        grid_cell_x_align: CENTER
                        grid_cell_y_align: CENTER
                        options:
                          - "00"
                          - "05"
                          - "10"
                          - "15"
                          - "20"
                          - "30"
                          - "45"
                        selected_index: 0
                    # Row 2 — Start bottom-left, Status center, Cancel bottom-right
                    - button:
                        width: 110
                        height: 34
                        styles: button_style
                        pressed:
                          styles: button_pressed_style
                        align: CENTER
                        grid_cell_column_pos: 0
                        grid_cell_row_pos: 2
                        grid_cell_x_align: START
                        grid_cell_y_align: END
                        widgets:
                          - label:
                              align: CENTER
                              text: "Start"
                              text_font: my_font
                              text_color: 0x44FF88
                        on_release:
                          then:
                            - lambda: |-
                                int h = id(timer_roller_hours).get_selected_index();
                                int m_idx = id(timer_roller_minutes).get_selected_index();
                                int m_vals[] = {0,1,2,3,4,5,10,15,20,25,30,45};
                                int m = m_vals[m_idx];
                                int s_idx = id(timer_roller_seconds).get_selected_index();
                                int s_vals[] = {0,5,10,15,20,30,45};
                                int s = s_vals[s_idx];
                                int total_seconds = h*3600 + m*60 + s;
                                if (total_seconds > 0) {
                                  id(timer_set_seconds) = total_seconds;
                                  id(timer_running) = true;
                                  int ph = total_seconds / 3600;
                                  int pm = (total_seconds % 3600) / 60;
                                  int ps = total_seconds % 60;
                                  id(time_remaining_0).publish_state(str_sprintf("%d:%02d:%02d", ph, pm, ps));
                                }
                            - if:
                                condition:
                                  lambda: return id(timer_running);
                                then:
                                  - lvgl.label.update:
                                      id: lbl_timer_status
                                      text: "Timer started!"
                                  - delay: 1s
                                  - lvgl.page.show: idle_page
                                  - script.execute: draw_display
