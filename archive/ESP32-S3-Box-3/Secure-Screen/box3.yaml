                          - "9"
                        selected_index: 0
                    - label:
                        text: ":"
                        text_font: my_font22
                        text_color: 0xFFFFFF
                        align: CENTER
                        text_align: CENTER
                        grid_cell_column_pos: 1
                        grid_cell_row_pos: 1
                        grid_cell_x_align: CENTER
                        grid_cell_y_align: CENTER
                    - roller:
                        id: timer_roller_minutes
                        width: 50
                        height: 70
                        align: CENTER
                        grid_cell_column_pos: 2
                        grid_cell_row_pos: 1
                        grid_cell_x_align: CENTER
                        grid_cell_y_align: CENTER
                        options:
                          - "00"
                          - "01"
                          - "02"
                          - "03"
                          - "04"
                          - "05"
                          - "10"
                          - "15"
                          - "20"
                          - "25"
                          - "30"
                          - "45"
                        selected_index: 0
