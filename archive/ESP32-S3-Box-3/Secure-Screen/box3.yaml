                    # Row 1 — rollers and colons
                    - roller:
                        id: timer_roller_hours
                        width: 50
                        height: 70
                        align: CENTER
                        grid_cell_column_pos: 0
                        grid_cell_row_pos: 1
                        grid_cell_x_align: CENTER
                        grid_cell_y_align: CENTER
                        options:
                          - "0"
                          - "1"
