                        text_color: 0xAAAAAA
                        align: CENTER
                        text_align: CENTER
                        grid_cell_column_pos: 0
                        grid_cell_row_pos: 0
                        grid_cell_x_align: CENTER
                        grid_cell_y_align: CENTER
                    - label:
