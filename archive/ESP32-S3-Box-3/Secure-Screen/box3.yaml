##############################################################################
## BOX SENSORS PAGE
##############################################################################
    - id: s3box_sensors_page
      skip: true
      on_load:
        then:
          - lvgl.label.update:
              id: s3box_temp_label
              text: !lambda |-
                char buf[12];
                float val = id(s3temp).state;
                if (id(temp_unit).current_option() == "Fahrenheit") {
                  val = val * 9.0 / 5.0 + 32.0;
                  sprintf(buf, "%.1f°F", val);
                } else {
                  sprintf(buf, "%.1f°C", val);
                }
                return buf;
          - lvgl.label.update:
              id: s3box_humidity_label
              text: !lambda |-
                char buf[10];
                sprintf(buf, "%.1f%%", id(s3humidity).state);
                return buf;
      widgets:
        - obj:
            styles: page_content
            widgets:
              - obj:
                  align: TOP_MID
                  styles: header_footer
                  widgets:
                    - label:
                        text: 'Box Sensors'
                        y: 3
