### CLIMATE PAGE TEXT SENSORS ###
  - platform: homeassistant
    id: climate1_item
    entity_id: ${climate1_entity}
    internal: true
    on_value:
      then:
        - if:
            condition: 
                lambda: return (id(climate1_item).state == "off");
            then:
              - lvgl.dropdown.update:
                  id: dropdown_studioacmode
                  selected_index: 0
              - lvgl.widget.update:
                  id: but_climate_1
                  state:
                    checked: false
              - lvgl.widget.update:
                  id: but_studioac_1
                  state:
                    checked: false
        - if:
            condition: 
                and:
                  - lambda: return (id(climate1_item).state != "off");
                  - lambda: return (id(climate1_item).state != "unavailable");
            then:
              - lvgl.widget.update:
                  id: but_climate_1
                  state:
                    checked: true
              - lvgl.widget.update:
                  id: but_studioac_1
                  state:
                    checked: true
              - if:
                  condition:
                    lambda: return (id(climate1_item).state == "heat_cool");
                  then:
                    - lvgl.dropdown.update:
                        id: dropdown_studioacmode
                        selected_index: 1
              - if:
                  condition:
                    lambda: return (id(climate1_item).state == "heat");
                  then:
                    - lvgl.dropdown.update:
                        id: dropdown_studioacmode
                        selected_index: 2
              - if:
                  condition:
                    lambda: return (id(climate1_item).state == "cool");
                  then:
                    - lvgl.dropdown.update:
                        id: dropdown_studioacmode
                        selected_index: 3
              - if:
                  condition:
                    lambda: return (id(climate1_item).state == "dry");
                  then:
                    - lvgl.dropdown.update:
                        id: dropdown_studioacmode
                        selected_index: 4

### SCREENSAVER FORECAST CONDITION ###
  - platform: homeassistant
    id: external_temp_condition
