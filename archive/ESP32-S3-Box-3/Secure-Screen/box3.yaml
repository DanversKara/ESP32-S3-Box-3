binary_sensor:
  # ── Front Door Lock Screen — door status sensors ──────────────────────────
  - platform: homeassistant
    id: door_alarm_door_item
    entity_id: ${door_alarm_door_entity}
    internal: true
    trigger_on_initial_state: true
    on_state:
      then:
        - if:
            condition:
              lambda: return x;
            then:
              - lvgl.label.update:
                  id: lbl_door_alarm_status
                  text_color: amber
                  text: '${door_alarm_door_name}: Open'
              - lvgl.label.update:
                  id: lbl_saver_door_alarm_status
                  text_color: amber
                  text: 'DA: Open'
            else:
              - lvgl.label.update:
                  id: lbl_door_alarm_status
                  text_color: 0xCCCCCC
                  text: '${door_alarm_door_name}: Closed'
              - lvgl.label.update:
                  id: lbl_saver_door_alarm_status
                  text_color: 0xCCCCCC
                  text: 'DA: Closed'

  # side physical button
  - platform: gpio
    pin:
      number: ${side_button_pin}
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
    id: side_top_button
    internal: true
    on_multi_click:
      - timing:
          - ON for at least 50ms
          - OFF for at least 50ms
        then:
          - if:
              condition:
                - lvgl.page.is_showing: saver_page
              then:
                - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
                - script.execute: draw_display
              else:
                - if:
                    condition:
                      - lvgl.page.is_showing: ${default_page}
                    then:
                      - script.execute: saver_enabled_manual
                    else:
                      - script.execute: draw_display
          - if:
              condition:
                - voice_assistant.is_running
              then:
                - voice_assistant.stop
          - if:
              condition:
                - switch.is_on: timer_ringing
              then:
                - script.execute: stopalarmtimer
          - if:
              condition:
                - media_player.is_playing:
              then:
                - media_player.stop:
          - if:
              condition:
                - switch.is_on: output_audio
              then:
                - homeassistant.service:
                    service: media_player.media_stop
                    data:
                      entity_id: media_player.${external_media_player}
      - timing:
          - ON for at least 10s
        then:
          - button.press: factory_reset_btn

  # red circle home button
  - platform: gt911
    id: home_button
    index: 0
    on_press:
      - if:
          condition:
            - voice_assistant.is_running
          then:
            - voice_assistant.stop
      - if:
          condition:
            - switch.is_on: timer_ringing
          then:
            - script.execute: stopalarmtimer
      - if:
          condition:
            - media_player.is_playing:
          then:
            - media_player.stop:
      - if:
          condition:
            - switch.is_on: output_audio
          then:
            - homeassistant.service:
                service: media_player.media_stop
                data:
                  entity_id: media_player.${external_media_player}
      - if:
          condition:
            - lvgl.page.is_showing: ${default_page}
          then:
            # Front door lock screen: always raise the keypad — this hardware
            # button is a deliberate manual PIN-entry shortcut, regardless of
            # the "Require PIN to unlock" switch.
            - lvgl.widget.hide: lbl_keypad_error
            - lambda: id(alarm_action) = "unlock_front_door";
            - lvgl.page.show: alarm_keypad_page
          else:
            - if:
                # Settings home — back out to the lock screen entirely.
                condition:
                  lvgl.page.is_showing: idle_page
                then:
                  - lvgl.page.show: main_lock_page
                else:
                  - if:
                      # Studio AC detail — back to the climate list.
                      condition:
                        lvgl.page.is_showing: climate_studio_page
                      then:
                        - lvgl.page.show: climate_page
                      else:
                        - if:
                            # Screensaver sub-settings — back to the screensaver page.
                            condition:
                              lvgl.page.is_showing: timeout_settings_page
                            then:
                              - lvgl.page.show: ss_set_page
                            else:
                              - if:
                                  # Leaf pages under the Settings hub.
                                  condition:
                                    or:
                                      - lvgl.page.is_showing: lock_set_page
                                      - lvgl.page.is_showing: voice_set_page
                                      - lvgl.page.is_showing: ss_set_page
                                      - lvgl.page.is_showing: info_page
                                      - lvgl.page.is_showing: device_set_page
                                      - lvgl.page.is_showing: ui_set_page
                                  then:
                                    - lvgl.page.show: lights_widget_page
                                  else:
                                    - if:
                                        # Everything else in the settings area — back to settings home.
                                        condition:
                                          or:
                                            - lvgl.page.is_showing: page2
                                            - lvgl.page.is_showing: climate_page
                                            - lvgl.page.is_showing: lights_page
                                            - lvgl.page.is_showing: controls_page
                                            - lvgl.page.is_showing: media_page
                                            - lvgl.page.is_showing: scenes_page
                                            - lvgl.page.is_showing: security_page
                                            - lvgl.page.is_showing: s3box_sensors_page
                                            - lvgl.page.is_showing: cctv_page
                                            - lvgl.page.is_showing: liv_lite_page
                                            - lvgl.page.is_showing: lights_widget_page
                                            - lvgl.page.is_showing: wifi_page
                                            - lvgl.page.is_showing: alarmclock_page
                                            - lvgl.page.is_showing: set_timer_page
                                        then:
                                          - lvgl.page.show: idle_page
                                        else:
                                          # Not a settings page (screensaver, voice popups,
                                          # notifications, etc.) — keep the original wake/refresh.
                                          - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
                                          - script.execute: draw_display
            - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
            - script.execute: draw_display

  # radar sensor
  - platform: gpio
    pin:
      number: GPIO21
    name: "Presence detect"
    disabled_by_default: false
    device_class: "occupancy"
    trigger_on_initial_state: true
    filters:
      - delayed_off: !lambda return id(radar_delayed_off).state * 1000;
    on_state:
      - if:
          condition:
            and:
              - lambda: "return x;"
              - switch.is_on: s_saver
              - switch.is_on: s_saver_presc
              - lambda: return id(wifi_connection) || id(ethernet_connection);
              - lambda: return id(api_connection);
          then:
            - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
            - lvgl.page.show: ${default_page}
            - script.execute: draw_display
      - if:
          condition:
            and:
              - lambda: "return x;"
              - switch.is_on: stopringonpresence
              - switch.is_on: timer_ringing
              - switch.is_off: snoozeonpresence
          then:
            - script.execute: stopalarmtimer
      - if:
          condition:
            and:
              - lambda: "return x;"
              - switch.is_on: stopringonpresence
              - switch.is_on: timer_ringing
              - switch.is_on: snoozeonpresence
              - switch.is_on: alarmclock
              - lambda: return !id(alarmclock_ringing);
          then:
            - script.execute: stopalarmtimer
      - if:
          condition:
            and:
              - lambda: "return x;"
              - switch.is_on: timer_ringing
              - switch.is_on: snoozeonpresence
              - switch.is_on: alarmclock
              - lambda: return id(alarmclock_ringing);
          then:
            - script.execute: snoozealarm

  # LIGHT PAGE BINARY SENSORS
  - platform: homeassistant
    id: light1_item
