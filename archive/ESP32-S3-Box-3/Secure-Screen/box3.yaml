select:
  - platform: template
    entity_category: config
    name: Wake word engine location
    id: wake_word_engine_location
    icon: "mdi:account-voice"
    optimistic: true
    restore_value: true
    options:
      - In Home Assistant
      - On device
    on_value:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - wait_until:
                lambda: return id(voice_assistant_phase) == ${voice_assist_muted_phase_id} || id(voice_assistant_phase) == ${voice_assist_idle_phase_id};
            - if:
                condition:
                  lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
                then:
                  - lambda: ESP_LOGD("wake_word_engine_location", "Set to In Home Assistant");
                  - lvgl.dropdown.update:
                      id: dropdown_wakeword
                      selected_index: 0
                  - micro_wake_word.stop:
                  - delay: 500ms
                  - if:
                      condition:
                        switch.is_off: mute_switch
                      then:
                        - lambda: id(va).set_use_wake_word(true);
                        - voice_assistant.start_continuous:
            - if:
                condition:
                  lambda: return id(wake_word_engine_location).current_option() == "On device";
                then:
                  - lambda: ESP_LOGD("wake_word_engine_location", "Set to On Device");
                  - lvgl.dropdown.update:
                      id: dropdown_wakeword
                      selected_index: 1
                  - lambda: id(va).set_use_wake_word(false);
                  - voice_assistant.stop
                  - delay: 500ms
                  - if:
                      condition:
                        switch.is_off: mute_switch
                      then:
                        - micro_wake_word.start:
          else:
            - if:
                condition:
                  lambda: return id(wake_word_engine_location).current_option() == "On device";
                then:
                  - lambda: ESP_LOGD("wake_word_engine_location", "Set to On Device");
                  - lvgl.dropdown.update:
                      id: dropdown_wakeword
                      selected_index: 1

  - platform: template
    name: "Wake word sensitivity"
    optimistic: true
    initial_option: Moderately sensitive
    restore_value: true
    entity_category: config
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    on_value:
      lambda: |-
        if (x == "Slightly sensitive") {
          id(okay_computer).set_probability_cutoff(247);
        } else if (x == "Moderately sensitive") {
          id(okay_computer).set_probability_cutoff(235);
        } else if (x == "Very sensitive") {
          id(okay_computer).set_probability_cutoff(212);
        }

  - platform: lvgl
    id: time_format
    entity_category: config
    restore_value: true
    name: Time Format
    widget: dropdown_timeformat

  - platform: lvgl
    id: ss_clockstyle
    entity_category: config
    restore_value: true
    name: Screensaver Clock
    widget: dropdown_ssclock
    
  - platform: lvgl
    id: uimode
    entity_category: config
    restore_value: true
    name: UI Mode
    widget: dropdown_uimode

  - platform: template
    id: temp_unit
    name: "Temperature Unit"
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - Celsius
      - Fahrenheit
    initial_option: Celsius
    on_value:
      - if:
          condition:
            lambda: return id(temp_unit).current_option() == "Celsius";
          then:
            - lvgl.dropdown.update:
                id: dropdown_tempunit
                selected_index: 0
          else:
            - lvgl.dropdown.update:
                id: dropdown_tempunit
                selected_index: 1

  - platform: lvgl
    id: sel_alarmclock_hour
    widget: alarmclock_hour
    name: "AlarmClock Hour"
    entity_category: config
    internal: true
    restore_value: true
    
  - platform: lvgl
    id: sel_alarmclock_minutes
    widget: alarmclock_minutes
    name: "AlarmClock Minutes"
    entity_category: config    
    internal: true
    restore_value: true

datetime:
  - id: alarmclock_time
    platform: template
    type: time
    optimistic: true
    restore_value: true
    initial_value:
      hour: 00
      minute: 00
      second: 00
    name: "Alarm Clock Time"
    icon: 'mdi:alarm'
    on_value:
      then:
        - if:
            condition:
              - lambda: return ((id(alarmclock_hour).get_selected_index() != (id(alarmclock_time).hour / 1)) || (id(alarmclock_minutes).get_selected_index() != (id(alarmclock_time).minute / 1)));
            then:
              - select.set_index:
                  id: sel_alarmclock_hour
                  index: !lambda return (id(alarmclock_time).hour / 1);
              - select.set_index:
                  id: sel_alarmclock_minutes
                  index: !lambda return (id(alarmclock_time).minute / 1);
        - if:
            condition:
              lambda: return id(alarmclock_time).hour < 12;
            then:
              - lvgl.label.update:
                  id: lbl_ampm
                  text: "AM"
            else:
              - lvgl.label.update:
                  id: lbl_ampm
                  text: "PM"

  - id: reboot_time
    platform: template
    type: time
    optimistic: true
    restore_value: true
    initial_value:
      hour: 02
      minute: 00
      second: 00
    name: "Reboot Time"
    icon: 'mdi:restart-alert'
    entity_category: config

