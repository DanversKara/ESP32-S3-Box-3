  - id: fetch_first_active_timer
    then:
      - lambda: |
          const auto &timers = id(va).get_timers();
          auto output_timer = *timers.begin();
          for (const auto &timer : timers) {
            if (timer.is_active && timer.seconds_left <= output_timer.seconds_left) {
              output_timer = timer;
            }
          }
          id(global_first_active_timer) = output_timer;
  - id: check_if_timers_active
    then:
      - lambda: |
          const auto &timers = id(va).get_timers();
          bool output = false;
          for (const auto &timer : timers) {
            if (timer.is_active) {
              output = true;
            }
          }
          id(global_is_timer_active) = output;
  - id: fetch_first_timer
    then:
      - lambda: |
          const auto &timers = id(va).get_timers();
          auto output_timer = *timers.begin();
          for (const auto &timer : timers) {
            if (timer.seconds_left <= output_timer.seconds_left) {
              output_timer = timer;
            }
          }
          id(global_first_timer) = output_timer;
  - id: check_if_timers
    then:
      - lambda: |
          const auto &timers = id(va).get_timers();
          bool output = false;
          for (const auto &timer : timers) {
            output = true;
          }
          id(global_is_timer) = output;

  - id: draw_timer_timeline
    then:
      - if:
          condition:
            lambda: |-
              id(check_if_timers_active).execute();
              id(check_if_timers).execute();
              return id(global_is_timer_active);
          then:
            - lvgl.widget.show: lbl_timer
            - lvgl.widget.show: bar_timer
            - lvgl.bar.update:
                id: bar_timer
                value: !lambda |-
                  id(fetch_first_active_timer).execute();
                  int percent_timer_left = round( 100 * id(global_first_active_timer).seconds_left / max(id(global_first_active_timer).total_seconds , static_cast<uint32_t>(1)));
                  return percent_timer_left;
          else:
            if:
              condition:
                lambda: |-
                  id(check_if_timers_active).execute();
                  id(check_if_timers).execute();
                  return id(global_is_timer);
              then:
                - lvgl.widget.show: lbl_timer
                - lvgl.widget.show: bar_timer
                - lvgl.bar.update:
                    id: bar_timer
                    value: !lambda |-
                      id(fetch_first_timer).execute();
                      int percent_timer_left = round( 100 * id(global_first_timer).seconds_left / max(id(global_first_timer).total_seconds , static_cast<uint32_t>(1)));
                      return percent_timer_left;
              else:
                - lvgl.widget.hide: lbl_timer
                - lvgl.widget.hide: bar_timer

  - id: draw_active_timer_widget
    then:
      if:
        condition:
          lambda: |-
            id(check_if_timers_active).execute();
            return id(global_is_timer_active);
        then:
          - lvgl.label.update:
              id: lbl_time_remaining
              text: !lambda |-
                char buf[15];
                id(fetch_first_active_timer).execute();
                int hours_left = floor(id(global_first_active_timer).seconds_left / 3600);
                int minutes_left = floor((id(global_first_active_timer).seconds_left - hours_left * 3600) / 60);
                int seconds_left = id(global_first_active_timer).seconds_left - hours_left * 3600 - minutes_left * 60 ;
                auto display_hours = (hours_left < 10 ? "0" : "") + std::to_string(hours_left);
                auto display_minute = (minutes_left < 10 ? "0" : "") + std::to_string(minutes_left);
                auto display_seconds = (seconds_left  < 10 ? "0" : "") + std::to_string(seconds_left) ;
                std::string display_string = "";
                if (hours_left > 0) {
                  display_string = display_hours + ":" + display_minute;
                } else {
                  display_string = display_minute + ":" + display_seconds;
                }
                sprintf(buf, "%s", display_string.c_str());
                return buf;

  - id: set_volume
    then:
      - media_player.volume_set:
          volume: !lambda return 0.5 + id(speaker_volume) * 0.03 ;
      - lvgl.bar.update:
          id: bar_volume
          value: !lambda return id(speaker_volume) * 10 ;

  - id: saver_enabled
    then:
      - if:
          condition:
            and:
              - switch.is_on: s_saver
              - not:
                  lvgl.page.is_showing: saver_page
          then:
            - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
            - delay: !lambda return id(s_saver_delay).state * 1000;
            - lambda: id(led).turn_on().set_brightness(id(s_saver_brightness).state /100).perform();
            - lvgl.widget.hide: lbl_time
            - lvgl.page.show: saver_page
      - if:
          condition:
            and:
              - switch.is_on: s_saver_mode
              - lvgl.page.is_showing: saver_page
          then:
            - delay: !lambda return id(s_saver_blank_delay).state * 1000;
            - light.turn_off: led
    mode: restart

  - id: saver_enabled_manual
    then:
      - if:
          condition:
            - switch.is_on: s_saver
          then:
            - lambda: id(led).turn_on().set_brightness(id(s_saver_brightness).state /100).perform();
            - lvgl.widget.hide: lbl_time
            - lvgl.page.show: saver_page

      - if:
          condition:
            - switch.is_on: s_saver_mode
          then:
            - delay: !lambda return id(s_saver_blank_delay).state * 1000;
            - light.turn_off: led
    mode: restart

  - id: start_wake_word
    then:
      - lambda: ESP_LOGD("script", "start_wake_word");
      - if:
          condition:
            and:
              - not:
                  - voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.start:
      - if:
          condition:
            and:
              - not:
                  - voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start_continuous:

  - id: stop_wake_word
    then:
      - lambda: ESP_LOGD("script", "stop_wake_word");
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - micro_wake_word.stop:

  - id: set_idle_or_mute_phase
    then:
      - lambda: ESP_LOGD("script", "set_idle_or_mute_phase");
      - if:
          condition:
            switch.is_off: mute_switch
          then:
            - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
          else:
            - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};

  - id: timer_started_external
    then:
      while:
        condition:
          switch.is_on: timer_ringing
        then:
          - homeassistant.service:
              service: media_player.play_media
              data:
                entity_id: media_player.${external_media_player}
                media_content_id: '${home_assistant_host}${timerfinished_external}'
                media_content_type: music
          - delay: 1700ms

  - id: timer_ending
    then:
      - wait_until:
          - or:
              - lambda: return (id(time_remaining_0).state == "0:00:10");
              - lambda: return (id(time_remaining_0).state == "0:00:30");
              - lambda: return (id(time_remaining_0).state == "0:01:00");
              - lambda: return (id(time_remaining_0).state == "0:05:00");
              - lambda: return (id(time_remaining_0).state == "0:10:00");
      - lambda: id(voice_assistant_phase) = ${voice_assist_timer_finishing_phase_id};
      - script.execute: draw_display
    mode: parallel

  - id: set_alarm_status
    then:
      - if:
          condition: 
              lambda: return (id(alarm_status).state == "disarmed");
          then:
            - lvgl.label.update:
                id: lbl_alarm_status
                text: "Disarmed"
            - lvgl.buttonmatrix.update:
                id: btn_mx_alarm
                items:
                  checked:
                    text_color: red
            - lvgl.style.update:
                id: page_content
                bg_color: 0x000000
            - lvgl.style.update:
                id: clock_bg
                bg_color: 0x000000
            - lvgl.label.update:
                id: lbl_alarm
                text: !lambda |-
                  static char buf[10];
                  std::string icon;
                  icon = "\U000F099E";
                  snprintf(buf, sizeof(buf), "%s", icon.c_str());
                  return buf;
                text_color: red
            - lvgl.matrix.button.update:
                id: but_disarm
                selected: true
                control:
                  checked: true
      - if:
          condition: 
              lambda: return (id(alarm_status).state == "pending");
          then:
            - lvgl.label.update:
                id: lbl_alarm_status
                text: "Pending"
            - lvgl.buttonmatrix.update:
                id: btn_mx_alarm
                items:
                  checked:
                    text_color: amber
            - lvgl.style.update:
                id: page_content
                bg_color: ${alarm_background_pending}
            - lvgl.style.update:
                id: clock_bg
                bg_color: ${alarm_background_pending}
            - lvgl.label.update:
                id: lbl_alarm
                text_color: amber  
      - if:
          condition: 
              lambda: return (id(alarm_status).state == "arming");
          then:
            - lvgl.label.update:
                id: lbl_alarm_status
                text: "Arming"
            - lvgl.buttonmatrix.update:
                id: btn_mx_alarm
                items:
                  checked:
                    text_color: amber
            - lvgl.style.update:
                id: page_content
                bg_color: ${alarm_background_pending}
            - lvgl.style.update:
                id: clock_bg
                bg_color: ${alarm_background_pending}
            - lvgl.label.update:
                id: lbl_alarm
                text: !lambda |-
                  static char buf[10];
                  std::string icon;
                  icon = "\U000F0565";
                  snprintf(buf, sizeof(buf), "%s", icon.c_str());
                  return buf;
                text_color: amber                  
      - if:
          condition: 
              lambda: return (id(alarm_status).state == "armed_home");
          then:
            - lvgl.label.update:
                id: lbl_alarm_status
                text: "Armed Home"
            - lvgl.buttonmatrix.update:
                id: btn_mx_alarm
                items:
                  checked:
                    text_color: lime
            - lvgl.style.update:
                id: page_content
                bg_color: ${alarm_background_on}
            - lvgl.style.update:
                id: clock_bg
                bg_color: ${alarm_background_on}
            - lvgl.label.update:
                id: lbl_alarm
                text: !lambda |-
                  static char buf[10];
                  std::string icon;
                  icon = "\U000F068A";
                  snprintf(buf, sizeof(buf), "%s", icon.c_str());
                  return buf;
                text_color: green
            - lvgl.matrix.button.update:
                id: but_armhome
                selected: true
                control:
                  checked: true
      - if:
          condition: 
              lambda: return (id(alarm_status).state == "armed_away");
          then:
            - lvgl.label.update:
                id: lbl_alarm_status
                text: "Armed Away"
            - lvgl.buttonmatrix.update:
                id: btn_mx_alarm
                items:
                  checked:
                    text_color: lime
            - lvgl.style.update:
                id: page_content
                bg_color: ${alarm_background_on}
            - lvgl.style.update:
                id: clock_bg
                bg_color: ${alarm_background_on}
            - lvgl.label.update:
                id: lbl_alarm
                text: !lambda |-
                  static char buf[10];
                  std::string icon;
                  icon = "\U000F099D";
                  snprintf(buf, sizeof(buf), "%s", icon.c_str());
                  return buf;
                text_color: green
            - lvgl.matrix.button.update:
                id: but_armaway
                selected: true
                control:
                  checked: true
      - if:
          condition: 
              lambda: return (id(alarm_status).state == "armed_night");
          then:
            - lvgl.label.update:
                id: lbl_alarm_status
                text: "Armed Night"
            - lvgl.buttonmatrix.update:
                id: btn_mx_alarm
                items:
                  checked:
                    text_color: lime
            - lvgl.style.update:
                id: page_content
                bg_color: ${alarm_background_on}
            - lvgl.style.update:
                id: clock_bg
                bg_color: ${alarm_background_on}
            - lvgl.label.update:
                id: lbl_alarm
                text: !lambda |-
                  static char buf[10];
                  std::string icon;
                  icon = "\U000F1828";
                  snprintf(buf, sizeof(buf), "%s", icon.c_str());
                  return buf;
                text_color: green
            - lvgl.matrix.button.update:
                id: but_armnight
                selected: true
                control:
                  checked: true
      - if:
          condition: 
              lambda: return (id(alarm_status).state == "triggered");
          then:
            - lvgl.label.update:
                id: lbl_alarm_status
                text: "Triggered"
            - lvgl.buttonmatrix.update:
                id: btn_mx_alarm
                items:
                  checked:
                    text_color: red
            - lvgl.style.update:
                id: page_content
                bg_color: ${alarm_background_triggered}
            - lvgl.style.update:
                id: clock_bg
                bg_color: ${alarm_background_triggered}
            - lvgl.label.update:
                id: lbl_alarm
                text_color: red 
      - lvgl.widget.redraw:

  - id: show_notification
    then:
      - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
      - if:
          condition:
            and:
              - switch.is_off: output_audio
              - switch.is_on: notify_sound
          then:
            - media_player.speaker.play_on_device_media_file:
                media_file: notify_sound_file
                announcement: true
            - wait_until:
                not:
                  - media_player.is_announcing:
            - delay: 200ms
          else:
            if:
              condition:
                and:
                  - switch.is_on: notify_sound
                  - switch.is_on: output_audio
              then:
                - homeassistant.service:
                    service: media_player.play_media
                    data:
                      entity_id: media_player.${external_media_player}
                      media_content_id: '${home_assistant_host}${notify_external}'
                      media_content_type: music
                - delay: 500ms
      - lvgl.page.show: notification_page
      - lvgl.textarea.update:
          id: area_notification
          text: !lambda |-
            const char* notifytext = id(notification_text).state.c_str();
            return notifytext;
      - delay: 15s
      - lambda: id(previous_notification_text) = "";
      - text.set:
          id: notification_text
          value: ""
      - lvgl.page.show: ${default_page}
      - script.execute: draw_display

  - id: time_update
    then:
      - lvgl.label.update:
          id: daydate_label
          text: !lambda |-
            static const char* days[] {"${sun}","${mon}","${tue}","${wed}","${thur}","${fri}","${sat}"};
            static const char* months[] {"${january}","${february}","${march}","${april}","${may}","${june}","${july}","${august}","${september}","${october}","${november}","${december}"};
            auto t = id(ha_time).now();
            char buffer[50];
            sprintf(buffer, "%s %s %d",days[t.day_of_week - 1],months[t.month - 1],t.day_of_month);
            return std::string(buffer);
      - if:
          condition:
            - lambda: 'return { id(time_format).current_option() == "24 Hr" };'
          then:
            - lvgl.label.update:
                id: lbl_time
                text: 
                  time_format: "%H:%M "
                  time: !lambda return id(ha_time).now();
            - lvgl.label.update:
                id: digitaltime
                text: 
                  time_format: "%H:%M"
                  time: !lambda return id(ha_time).now();
          else:
            - lvgl.label.update:
                id: lbl_time
                text: 
                  time_format: "%l:%M "
                  time: !lambda return id(ha_time).now();
            - lvgl.label.update:
                id: digitaltime
                text: 
                  time_format: "%l:%M %p"
                  time: !lambda return id(ha_time).now();
      - if:
          condition:
            and:
              - switch.is_on: alarmclock
              - lambda: 'return { (id(ha_time).now().hour == id(alarmclock_time).hour) };'
              - lambda: 'return { (id(ha_time).now().minute == id(alarmclock_time).minute) };'
              - lambda: 'return { (id(ha_time).now().second <= 15) };'
          then:
            - lambda: id(alarmclock_ringing) = true;
            - lvgl.widget.show: but_snooze
            - lambda: id(voice_assistant_phase) = ${voice_assist_timer_finished_phase_id};
            - script.execute: draw_display
            - switch.turn_on: timer_ringing
            - delay: 15s
      - if:
          condition:
            and:
              - switch.is_on: reboot_schedule
              - lambda: 'return { (id(ha_time).now().hour == id(reboot_time).hour) };'
              - lambda: 'return { (id(ha_time).now().minute == id(reboot_time).minute) };'
              - lambda: 'return { (id(ha_time).now().second <= 15) };'
          then:
            - delay: 10s
            - button.press: reboot
    mode: single
    
  - id: set_uimode
    then:
      - if:
          condition: 
            - lambda: return (id(uimode).current_option() != id(current_uimode));
          then:
            - if:
                condition: 
                  lambda: return (id(uimode).current_option() == "Home");
                then:
                  - lvgl.style.update:
                      id: header_footer
                      bg_color: 0x595959
                      bg_grad_color: 0x404040
                  - lvgl.style.update:
                      id: button_style
                      bg_color: 0x000000
                      bg_grad_color: 0x404040
                  - lvgl.style.update:
                      id: button_standard_style
                      bg_color: 0x216dab
                      bg_grad_color: 0x404040
                  - lvgl.style.update:
                      id: button_pressed_style
                      bg_color: 0x666666
                      bg_grad_color: 0x00334d
                  - lvgl.style.update:
                      id: button_checked_style
                      bg_color: 0x000000
                      bg_grad_color: 0x002233
            - lambda: strncpy(id(current_uimode), id(uimode).current_option().c_str(), 50);
            - lvgl.widget.redraw:

  - id: snoozealarm
    then:
      - lambda: id(alarmclock_ringing) = false;
      - lvgl.widget.hide: but_snooze
      - switch.turn_off: timer_ringing
      - lvgl.page.show: ${default_page}
      - script.execute: draw_display
      - delay: !lambda "return id(snooze_time).state * 1000;"
      - if:
          condition:
            switch.is_off: snoozeonpresence
          then:
            - lvgl.widget.show: but_snooze
          else:
            - lvgl.widget.hide: but_snooze
      - lambda: id(voice_assistant_phase) = ${voice_assist_timer_finished_phase_id};
      - switch.turn_on: timer_ringing
    mode: restart

  - id: stopalarmtimer
    then:
      - lambda: id(alarmclock_ringing) = false;
      - lvgl.widget.hide: but_snooze
      - switch.turn_off: timer_ringing
      - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
      - lvgl.page.show: ${default_page}
      - script.execute: draw_display
    mode: restart

  - id: showonlineimage
    then:
      # Images replaced with MDI icons - no online_image component needed
      - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
      - script.execute: saver_enabled
      - lvgl.page.show: image_page
      - delay: 30s
      - lvgl.page.show: ${default_page}
      - script.execute: draw_display
      - text.set:
          id: onlineimagefile
          value: ""
    mode: restart

  - id: cctv_refresh_loop
    mode: queued
    then:
      - delay: 300ms
      - online_image.set_url:
          id: cctv_image
          url: ${cctv_snapshot_url}
      - component.update: cctv_image
      - script.execute: cctv_refresh_loop

switch:
  - platform: gpio
    name: Speaker Enable
    id: speaker_enable
    pin:
      number: ${speaker_enable_pin}
      ignore_strapping_warning: true
    restore_mode: ALWAYS_OFF
    entity_category: config
    disabled_by_default: true

  - platform: template
    name: Display conversation
    id: display_conversation
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    icon: 'mdi:chat'
    turn_on_action:
      - lvgl.checkbox.update:
          id: chk_display_conversation
          state:
            checked: true
    turn_off_action:
      - lvgl.checkbox.update:
          id: chk_display_conversation
          state:
            checked: false

  - platform: template
    name: Output audio externally
    id: output_audio
    icon: 'mdi:volume-off'
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - media_player.volume_set:
          id: speaker_media_player
          volume: 0
      - lvgl.widget.hide: obj_media
      - lvgl.widget.hide: lbl_media_playing
      - lvgl.widget.hide: bar_volume
      - lvgl.widget.show: obj_ext_media
      - lvgl.widget.show: lbl_ext_media_playing
      - lvgl.checkbox.update:
          id: chk_output_audio
          state:
            checked: true
    on_turn_off:
      - media_player.volume_set:
          id: speaker_media_player
          volume: 0.8
      - lvgl.widget.show: obj_media
      - lvgl.widget.show: lbl_media_playing
      - lvgl.widget.show: bar_volume
      - lvgl.widget.hide: obj_ext_media
      - lvgl.widget.hide: lbl_ext_media_playing
      - lvgl.checkbox.update:
          id: chk_output_audio
          state:
            checked: false
 
  - platform: template
    name: Require PIN to unlock front door
    id: front_door_require_pin
    icon: 'mdi:lock-question'
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    turn_on_action:
      - lvgl.checkbox.update:
          id: chk_front_door_pin
          state:
            checked: true
    turn_off_action:
      - lvgl.checkbox.update:
          id: chk_front_door_pin
          state:
            checked: false

  - platform: template
    name: Mute
    id: mute_switch
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_off:
      - microphone.unmute:
      - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
      - lvgl.label.update:
          id: lbl_mic
          text_color: 0xFFFFFF
          text: !lambda |-
              static char buf[10];
              std::string icon;
              icon = "\U000F036C";
              snprintf(buf, sizeof(buf), "%s", icon.c_str());
              return buf;
      - script.execute: draw_display
    on_turn_on:
      - microphone.mute:
      - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
      - lvgl.label.update:
          id: lbl_mic
          text_color: 0xFF0000
          text: !lambda |-
              static char buf[10];
              std::string icon;
              icon = "\U000F036D";
              snprintf(buf, sizeof(buf), "%s", icon.c_str());
              return buf;
      - script.execute: draw_display

  - platform: template
    id: media_mute
    optimistic: true
    on_turn_on:
      - media_player.volume_set:
          id: speaker_media_player
          volume: 0
      - lvgl.label.update:
          id: lbl_media_mute
          text_color: red
          text: !lambda |-
              static char buf[10];
              std::string icon;
              icon = "\U000F0581";
              snprintf(buf, sizeof(buf), "%s", icon.c_str());
              return buf;
      - lvgl.bar.update:
          id: bar_volume
          indicator:
            bg_color: red
    on_turn_off:
      - media_player.volume_set:
          id: speaker_media_player
          volume: 0.8
      - lvgl.label.update:
          id: lbl_media_mute
          text_color: lime
          text: !lambda |-
              static char buf[10];
              std::string icon;
              icon = "\U000F057E";
              snprintf(buf, sizeof(buf), "%s", icon.c_str());
              return buf;
      - lvgl.bar.update:
          id: bar_volume
          indicator:
            bg_color: lime

  - platform: template
    name: "Reboot Schedule"
    id: reboot_schedule
    icon: 'mdi:restart'
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: s_saver
    name: ScrSave enable
    icon: mdi:sleep
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    turn_on_action:
      - lvgl.checkbox.update:
          id: chk_screensaver
          state:
            checked: true
    turn_off_action:
      - lvgl.checkbox.update:
          id: chk_screensaver
          state:
            checked: false

  - platform: template
    id: s_saver_mode
    name: ScrOff enable
    icon: 'mdi:monitor-off'
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    turn_on_action:
      - lvgl.checkbox.update:
          id: chk_timeout_blank
          state:
            checked: true
    turn_off_action:
      - lvgl.checkbox.update:
          id: chk_timeout_blank
          state:
            checked: false

  - platform: template
    id: s_saver_presc
    name: Screen wake on motion
    icon: 'mdi:motion-sensor'
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lvgl.checkbox.update:
          id: chk_wake_presence
          state:
            checked: true
    turn_off_action:
      - lvgl.checkbox.update:
          id: chk_wake_presence
          state:
            checked: false

  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF

    on_turn_off:
      # Disable stop wake word
      - micro_wake_word.disable_model: stop
      - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
      - lambda: id(time_remaining_0).publish_state ("0:00:00");
      - lambda: id(alarmclock_ringing) = false;
      - lambda: |-
              id(speaker_media_player)
                ->make_call()
                .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_OFF)
                .set_announcement(true)
                .perform();
              id(speaker_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 0);
      - media_player.stop:
          announcement: true
      - lvgl.widget.hide: lbl_timer
      - lvgl.widget.hide: bar_timer
      - lvgl.page.show: ${default_page}
      - script.execute: draw_display
    on_turn_on:
      - lambda: id(led).turn_on().set_brightness(1.0).perform();
      - lambda: |-
            id(speaker_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_ONE)
              .set_announcement(true)
              .perform();
            id(speaker_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 1000);
      - if:
          condition:
            switch.is_on: output_audio
          then:
            - script.execute: timer_started_external
          else:
            - media_player.speaker.play_on_device_media_file:
                media_file: timer_finished_sound
                announcement: true
      # Enable stop wake word
      - micro_wake_word.start:
      - micro_wake_word.enable_model: stop
      - delay: 15min
      - switch.turn_off: timer_ringing

  - platform: template
    id: wake_sound
    name: Play wake sound
    icon: mdi:music
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lvgl.checkbox.update:
          id: chk_wake_sound
          state:
            checked: true
    turn_off_action:
      - lvgl.checkbox.update:
          id: chk_wake_sound
          state:
            checked: false

  - platform: template
    id: notify_sound
    name: Notification sound
    icon: mdi:music
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF   
    turn_on_action:
      - lvgl.checkbox.update:
          id: chk_notify_sound
          state:
            checked: true
    turn_off_action:
      - lvgl.checkbox.update:
          id: chk_notify_sound
          state:
            checked: false
            
  - platform: template
    id: mute_response_switch
    name: Mute Responses
    icon: mdi:chat-sleep
    entity_category: config
