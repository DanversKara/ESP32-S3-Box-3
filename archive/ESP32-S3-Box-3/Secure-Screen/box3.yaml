text_sensor:
### LIGHT WIDGET STATE SENSOR ###
  - platform: homeassistant
    id: light_widget_state
    entity_id: ${light_widget_entity}
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: return (x == "on");
            then:
              - lvgl.widget.update:
                  id: btn_light_widget_toggle
                  state:
                    checked: true
              - lvgl.label.update:
                  id: ico_light_widget
                  text: "\U000F06E8"
                  text_color: yellow
            else:
              - lvgl.widget.update:
                  id: btn_light_widget_toggle
                  state:
                    checked: false
              - lvgl.label.update:
                  id: ico_light_widget
                  text: "\U000F0335"
                  text_color: 0x888888
  - id: text_request
    platform: template
    filters:
      - lambda: |-
          std::replace(x.begin(), x.end(), '\r', ' ');
          return x;
      - lambda: |-
          std::replace(x.begin(), x.end(), '\n', ' ');
          return x;
      - substitute:
          - "\u2011 ->  "
    on_value:
      - if:
          condition:
            - lambda: return (id(text_request).state.length()>40);
          then:
            - lvgl.label.update:
                id: lbl_v_text_request1
                long_mode: SCROLL_CIRCULAR
            - lvgl.label.update:
                id: lbl_v_text_request2
                long_mode: SCROLL_CIRCULAR
          else:
            - lvgl.label.update:
                id: lbl_v_text_request1
                long_mode: DOT
            - lvgl.label.update:
                id: lbl_v_text_request2
                long_mode: DOT
      - if:
          condition:
            lambda: return id(display_conversation).state;
          then:
            - lvgl.label.update:
                id: lbl_v_text_request1
                text: !lambda |-
                  return id(text_request).state;
            - lvgl.label.update:
                id: lbl_v_text_request2
                text: !lambda |-
                  return id(text_request).state;

  - id: text_response
    platform: template
    filters:
      - lambda: |-
          std::replace(x.begin(), x.end(), '\r', ' ');
          return x;
      - lambda: |-
          std::replace(x.begin(), x.end(), '\n', ' ');
          return x;
      - substitute:
          - "\u2011 ->  "
    on_value:
      - if:
          condition:
            - lambda: return (id(text_response).state.length()>40);
          then:
            - lvgl.label.update:
                id: lbl_v_text_response
                long_mode: SCROLL_CIRCULAR
          else:
            - lvgl.label.update:
                id: lbl_v_text_response
                long_mode: DOT
      - if:
          condition:
            lambda: return id(display_conversation).state;
          then:
            - lvgl.label.update:
                id: lbl_v_text_response
                text: !lambda |-
                  return id(text_response).state;
      
  - platform: wifi_info #requires WIFI
    ip_address:
      name: IP Address
      id: ip_addr
      entity_category: "diagnostic"
    ssid:
      id: connected_ssid
      name: SSID
      entity_category: "diagnostic"
    bssid:
      id: connected_bssid
      name: BSSID
