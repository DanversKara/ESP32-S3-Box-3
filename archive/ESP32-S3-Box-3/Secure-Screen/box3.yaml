###### Hardware Specific Configuration ######

  font_bpp: 1 #1,2,4,8 - Higher bit depth increases flash usage
  font_icon_bpp: 4 #1,2,4,8 - Higher bit depth increases flash usage
  image_byte_order: little_endian
  lvgl_byte_order: big_endian
  image_resize: 318x238 # 2px below width by height of screen

  wifi_fast_connect: false
  wifi_power_save_mode: LIGHT #NONE, LIGHT(default for esp32), HIGH
  wifi_use_native_roaming: true #if false uses ESPHome post connect roaming

  screen_max_brightness: 1.0

  speaker_i2s_dout_pin: GPIO15
  speaker_enable_pin: GPIO46

  side_button_pin: GPIO0
  
  page_content_height: 210
  taskbar_height: 30
  button_radius: 15

esp32:
  board: esp32s3box
  flash_size: 16MB
  cpu_frequency: 240MHz #160MHz to improve battery life, 240MHz otherwise.
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y" 
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y" 
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"
    advanced:
      execute_from_psram: true

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG
  logs:
    lvgl: info
    text_sensor: ERROR
    component: ERROR

output:
  - platform: ledc
    pin: GPIO47
    id: backlight_output

i2c:
  - id: bus_a
    sda: GPIO08
    scl: GPIO18
    scan: true
    sda_pullup_enabled: true
    scl_pullup_enabled: true
    frequency: 100kHz

  - id: bus_b
    sda: GPIO41
    scl: GPIO40
    scan: true
    sda_pullup_enabled: true
    scl_pullup_enabled: true
    frequency: 100kHz

at581x:
  id: "Radar"
  i2c_id: bus_b

touchscreen:
  - platform: gt911
    i2c_id: bus_a
    address: 0x5D
    id: gt911_touchscreen
    interrupt_pin:
      number: GPIO3
      ignore_strapping_warning: true
    on_touch:
      - lambda: ESP_LOGD("touchscreen", "on_touch");
      - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
    on_release:
      then:
        - if:
            condition: lvgl.is_paused
            then:
              - light.turn_on: led
              - lvgl.resume:
              - lvgl.widget.redraw:
        - if:
            condition:
              - lvgl.page.is_showing: saver_page
            then:
              - script.execute: draw_display

i2s_audio:
  - id: audio_bus
    i2s_lrclk_pin:
      number: GPIO45
      ignore_strapping_warning: true
    i2s_bclk_pin: GPIO17
    i2s_mclk_pin: GPIO2

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bus_a
    bits_per_sample: 16bit
    sample_rate: 16000

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_a
    bits_per_sample: 16bit
    sample_rate: 48000

microphone:
  - platform: i2s_audio
    id: box_mic
    sample_rate: 16000
    i2s_din_pin: GPIO16
    bits_per_sample: 16bit
    adc_type: external

spi:
  - id: spi_bus
    clk_pin: 7
    mosi_pin: 6

display:
  - platform: mipi_spi
    id: s3_box_lcd
    model: S3BOX
    data_rate: 40MHz
    cs_pin: 5
    dc_pin: 4
    reset_pin:
      number: 48
      inverted: true
    update_interval: never
    auto_clear_enabled: false
    color_order: bgr
    invert_colors: false

#### WIFI
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: ${wifi_fast_connect}
  power_save_mode: ${wifi_power_save_mode}
  enable_btm: ${wifi_use_native_roaming}  # 802.11v BSS Transition Management
  enable_rrm: ${wifi_use_native_roaming}  # 802.11k Radio Resource Management
  ap:
    ssid: ${name}
    password: ${wifi_fallback_pwd}   
  on_connect:
    - lambda: id(wifi_connection) = true;
    - script.execute: draw_display
    - switch.turn_on: speaker_enable
  on_disconnect:
    - lambda: id(wifi_connection) = false;
    - script.execute: draw_display

captive_portal:

###### Standard Configuration ######
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.4.0
  name_add_mac_suffix: false
  on_boot:
    priority: 600
    then:
      - delay: 15s
      - lvgl.widget.hide: boot_screen
      - at581x.settings:
          id: "Radar"
          sensing_distance: 1000
          stage_gain: 4
      - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
      - lambda: id(time_remaining_0).publish_state ("0:00:00");
      - script.execute: draw_display
      - if:
          condition:
            switch.is_on: output_audio
          then:
            media_player.volume_set:
              id: speaker_media_player
              volume: 0
      - if:
          condition:
            - lambda: return !id(radar_state);
          then:
            - switch.turn_off: radar_enable
      - delay: 30s
      - if:
          condition:
            lambda: return id(init_in_progress);
          then:
            - lambda: id(init_in_progress) = false;
            - script.execute: draw_display
  on_shutdown:
    then:
      - if:
          condition:
            switch.is_off: radar_enable
          then:
            - lambda: id(radar_state) = false;
          else:
            - lambda: id(radar_state) = true;

  project:
    name: "Christian.s3box3"
    version: "2026.04.16"

api:
  encryption:
    key: ${api_key}
  on_client_connected:
    - lambda: |-
        id(api_fail_count) = 0;
        id(api_connection) = true;
    - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
    - script.execute: draw_display
  on_client_disconnected:
    - lambda: |-
        id(api_fail_count) = 0;
        id(api_connection) = false;
    - script.execute: draw_display

ota:
  - platform: esphome
    id: ota_esphome
    on_begin:
      - lambda: id(led).turn_on().set_brightness(${screen_max_brightness}).set_transition_length(0).perform();
                id(led).loop();
      - lvgl.page.show: ota_page
      - lambda: "id(lvgl_display).loop();"
    on_progress:
      then:
        - lambda: "id(lvgl_display).loop();"

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: time_update
    on_time:
      - minutes: '*'
        seconds: 0
        then:
          - script.execute: time_update

interval:
  - interval: 150ms
    then:
      - script.execute: no_connection_glitch_tick
      - script.execute: boot_glitch_tick
  - interval: 2s #requires WIFI - fast disconnect detection only
    then:
      - if:
          condition:
            api.connected:
          then:
            - lambda: |-
                id(api_fail_count) = 0;
                id(api_connection) = true;
          else:
            - lambda: id(api_fail_count) += 1;
            - if:
                # Require a few consecutive failed checks before acting, so a
                # single momentary blip doesn't flash NO CONNECTION. This is a
                # local state check (api.connected), not a network ping, so it
                # doesn't add any extra traffic on its own — but a genuinely
                # flaky WiFi/AP will still legitimately reconnect a lot, which
                # is worth investigating separately if this keeps firing.
                condition:
                  and:
                    - lambda: return id(api_fail_count) >= 3;
                    - lambda: return !id(init_in_progress);
                then:
                  - lambda: id(api_connection) = false;
                  # Force the no-connection page back on top immediately, in case
                  # something else (radar/presence, notifications, timers, etc.)
                  # showed the lock screen in between checks.
                  - lvgl.widget.hide: lbl_api
                  - lvgl.widget.hide: lbl_wifi
                  - lvgl.widget.hide: boot_screen
                  - lvgl.widget.hide: topbar_container
                  - lvgl.page.show: no_connection_page
      - if:
          condition:
            and:
              - lambda: return !(id(ethernet_connection) || id(wifi_connection));
              - lambda: return !id(init_in_progress);
          then:
            - lvgl.widget.hide: lbl_api
            - lvgl.widget.hide: lbl_wifi
            - lvgl.widget.hide: boot_screen
            - lvgl.widget.hide: topbar_container
            - lvgl.page.show: no_connection_page
      # NOTE: draw_display is intentionally NOT called here. draw_display also
      # forces the lock screen back up (settings-menu auto-relock) whenever the
      # voice assistant is idle, so calling it every 2s would relock the
      # settings menu after 2 seconds instead of the original ~15s. It's
      # called from the slower interval below instead, and from all the normal
      # event triggers (api/wifi connect/disconnect, timers, voice assistant, etc).

  - interval: 15s #requires WIFI - periodic display refresh / settings auto-relock
    then:
      - script.execute: draw_display
      - if: #requires WIFI
          condition:
            - lambda: return id(wifi_connection);
          then:
            - lvgl.label.update:
                id: lbl_ip
                text: !lambda |-
                  const char* ip = id(ip_addr).state.c_str();
                  return ip;
            - lvgl.label.update:
                id: lbl_ssid
                text: !lambda |-
                  const char* ssid = id(connected_ssid).state.c_str();
                  return ssid;
            - lvgl.label.update:
                id: lbl_mac
                text: !lambda |-
                  const char* mac = id(device_mac).state.c_str();
                  return mac;

  - interval: 10s
    then:
      - if:
          condition:
            lambda: return !id(use_room_temp);
          then:
            - lambda: |-
                float celsius = id(s3temp).state;
                if (id(temp_unit).current_option() == "Fahrenheit") {
                  id(display_temp) = celsius * 9.0 / 5.0 + 32.0;
                } else {
                  id(display_temp) = celsius;
                }
            - lvgl.label.update:
                id: temp_label
                text: !lambda |-
                  char buf[10];
                  sprintf(buf, "%.${screensaver_temperature_dp}f%s", id(display_temp), id(temp_unit).current_option() == "Fahrenheit" ? "°F" : "°C");
                  return buf;
            - lvgl.label.update:
                id: humidity_label
                text: !lambda |-
                  char buf[10];
                  sprintf(buf, "%.${screensaver_humidity_dp}f%s", id(s3humidity).state, "%");
                  return buf;

  - interval: 1s
    then:
      - if:
          condition:
            lambda: return id(timer_running) && id(timer_set_seconds) > 0;
          then:
            - lambda: |-
                id(timer_set_seconds) -= 1;
                int secs = id(timer_set_seconds);
                int h = secs / 3600;
                int m = (secs % 3600) / 60;
                int s = secs % 60;
                id(time_remaining_0).publish_state(str_sprintf("%d:%02d:%02d", h, m, s));
      - if:
          condition:
            lambda: return id(timer_running) && id(timer_set_seconds) <= 0;
          then:
            - lambda: |-
                id(timer_running) = false;
                id(time_remaining_0).publish_state("0:00:00");
            - switch.turn_on: timer_ringing

button:
  - platform: factory_reset
    id: factory_reset_btn
    internal: true

  - platform: restart
    id: reboot
    name: "Reboot"
    entity_category: diagnostic

  - platform: template
    id: restart_radar
    name: "Radar Reset"
    entity_category: diagnostic
    on_press:
