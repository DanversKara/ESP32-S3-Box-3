                        grid_cell_row_pos: 2
                        grid_cell_x_align: CENTER
                        grid_cell_y_align: CENTER
                    - button:
                        width: 110
                        height: 34
                        styles: button_style
                        pressed:
                          styles: button_pressed_style
                        align: CENTER
                        grid_cell_column_pos: 4
                        grid_cell_row_pos: 2
                        grid_cell_x_align: END
                        grid_cell_y_align: END
                        widgets:
                          - label:
                              align: CENTER
                              text: "Cancel"
                              text_font: my_font
                              text_color: 0xFF4444
                        on_release:
                          then:
                            - lambda: |-
                                id(timer_running) = false;
                                id(timer_set_seconds) = 0;
                            - text_sensor.template.publish:
                                id: time_remaining_0
                                state: "0:00:00"
                            - lvgl.label.update:
                                id: lbl_timer_status
                                text: "Cancelled"
                            - delay: 1s
                            - lvgl.page.show: idle_page
                            - script.execute: draw_display

