text:
  - platform: template
    name: "Notification Text"
    id: notification_text
    mode: text
    optimistic: true
    on_value:
      then:
        - lambda: |-
            if (!id(notification_text).state.empty() && 
                (id(previous_notification_text).empty() || id(notification_text).state != id(previous_notification_text))) {
              id(previous_notification_text) = id(notification_text).state;
              id(show_notification).execute();
            }

  - platform: template
    id: onlineimagefile
    name: "Image URL"
    icon: mdi:link
    mode: text
    optimistic: true
    entity_category: "config"
    on_value:
      then:
        - if:
            condition:
              not:
                - lambda: return (x.empty() || x == "invalid" || x == "unknown");
            then:
              # online_image removed - show image_page icon for any URL entry
              - script.execute: showonlineimage

speaker:
  - id: i2s_audio_speaker
    platform: i2s_audio
    i2s_audio_id: audio_bus
    i2s_dout_pin: ${speaker_i2s_dout_pin}
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: mono
    audio_dac: es8311_dac
    buffer_duration: 100ms

  - id: mixing_speaker
    platform: mixer
    output_speaker: i2s_audio_speaker
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

media_player:
  - platform: speaker
    name: Media Player
    id: speaker_media_player
    # buffer_size: 2000000
    task_stack_in_psram: true
    volume_increment: 0.05
    volume_min: 0.5
    volume_max: 0.8
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 2
      sample_rate: 48000
    files:
      - id: timer_finished_sound
        file: ${timerfinished_ondevice}
      - id: wake_sound_file
        file: ${wakesound_ondevice}
      - id: notify_sound_file
        file: ${notify_ondevice}
    on_state:
      then:
        - lambda: ESP_LOGD("media_player", "on_state");
        - if:
            condition:
              media_player.is_playing:
            then:
              - lambda: |-
                  id(media_state) = true;
              - lvgl.label.update:
                  id: lbl_media_playing
                  text: "Playing"
                  text_color: lime
            else:
              - lambda: |-
                  id(media_state) = false;
              - lvgl.label.update:
                  id: lbl_media_playing
                  text: "Nothing Playing"
                  text_color: lightblue
        - if:
            condition:
              and:
                - switch.is_off: timer_ringing
                - not:
                    voice_assistant.is_running:
                - not:
                    media_player.is_announcing:
            then:
              - mixer_speaker.apply_ducking:
                  id: media_mixing_input
                  decibel_reduction: 0
                  duration: 1.0s
    on_play:
      - lambda: ESP_LOGD("media_player", "on_play");
      - wait_until:
          - lambda: return id(global_is_assisting) == false;
      - if:
          condition:
            - microphone.is_capturing:
          then:
            - script.execute: stop_wake_word
            - if:
                condition:
                  - lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
                then:
                  - wait_until:
                      - not:
                          voice_assistant.is_running:
    on_announcement:
      - lambda: ESP_LOGD("media_player", "on_announcement");
      - if:
          condition:
            - microphone.is_capturing:
          then:
            - script.execute: stop_wake_word
            - if:
                condition:
                  - lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
                then:
                  - wait_until:
                      - not:
                          voice_assistant.is_running:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
            - script.execute: draw_display
    on_idle:
      - lambda: ESP_LOGD("media_player", "on_idle");
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - wait_until:
                    - not:
                        speaker.is_playing:
                          id: i2s_audio_speaker
            - script.execute: start_wake_word
            - script.execute: set_idle_or_mute_phase
            - script.execute: draw_display
    on_pause:
      - media_player.stop
    on_volume:
      - lambda: |-
          ESP_LOGD("volume", "Volume: %f", x);
      - lambda: id(speaker_volume) = int(x * 10) ;
      - lvgl.bar.update:
          id: bar_volume
          value: !lambda return id(speaker_volume) * 10 ;

micro_wake_word:
  id: mww
  vad:
  stop_after_detection: false
  models:
    - model: https://raw.githubusercontent.com/esphome/micro-wake-word-models/refs/heads/main/models/v2/experiments/okay_computer.json
      id: okay_computer
    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
      id: stop
      internal: true
  on_wake_word_detected:
    - if:
        condition:
          switch.is_on: timer_ringing
        then:
          - script.execute: stopalarmtimer
        # Stop voice assistant if running
        else:
          - if:
              condition:
                voice_assistant.is_running:
              then:
                voice_assistant.stop:
              # Stop any other media player announcement
              else:
                - if:
                    condition:
                      - switch.is_on: output_audio
                    then:
                      - homeassistant.service:
                          service: media_player.media_stop
                          data:
                            entity_id: media_player.${external_media_player}
                - if:
                    condition:
                      media_player.is_announcing:
                    then:
                      - media_player.stop:
                          announcement: true
                    # Start the voice assistant and play the wake sound, if enabled
                    else:
                      - lambda: id(global_is_assisting) = true;
                      - delay: 50ms
                      - if:
                          condition:
                            and:
                              - switch.is_off: output_audio
                              - switch.is_on: wake_sound
                          then:
                            - media_player.speaker.play_on_device_media_file:
                                media_file: wake_sound_file
                                announcement: true
                            - wait_until:
                                not:
                                  - media_player.is_announcing:
                            - delay: 150ms
                          else:
                            - if:
                                condition:
                                  and:
                                    - switch.is_on: output_audio
                                    - switch.is_on: wake_sound
                                then:
                                  - homeassistant.service:
                                      service: media_player.play_media
                                      data:
                                        entity_id: media_player.${external_media_player}
                                        media_content_id: '${home_assistant_host}${wakesound_external}'
                                        media_content_type: music                            
                                  - delay: 500ms
                      - voice_assistant.start:
                          wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: box_mic
  media_player: speaker_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 4.0
  on_wake_word_detected:
    - if:
        condition:
          switch.is_on: timer_ringing
        then:
          - script.execute: stopalarmtimer
        else:
          - if:
              condition:
                - switch.is_on: output_audio
              then:
                - homeassistant.service:
                    service: media_player.media_stop
                    data:
                      entity_id: media_player.${external_media_player}
          - if:
              condition:
                media_player.is_announcing:
              then:
                - media_player.stop:
                    announcement: true
              # Start the voice assistant and play the wake sound, if enabled
              else:
                - lambda: id(global_is_assisting) = true;
                - delay: 50ms
                - if:
                    condition:
                      and:
                        - switch.is_off: output_audio
                        - switch.is_on: wake_sound
                    then:
                      - media_player.speaker.play_on_device_media_file:
                          media_file: wake_sound_file
                          announcement: true
                      - wait_until:
                          not:
                            - media_player.is_announcing:
                      - delay: 500ms
                    else:
                      if:
                        condition:
                          and:
                            - switch.is_on: wake_sound
                            - switch.is_on: output_audio
                        then:
                          - homeassistant.service:
                              service: media_player.play_media
                              data:
                                entity_id: media_player.${external_media_player}
                                media_content_id: '${home_assistant_host}${wakesound_external}'
                                media_content_type: music
  on_start:
    - script.execute: draw_display
  on_listening:
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_phase_id};
    - text_sensor.template.publish:
        id: text_request
        state: "..."
    - text_sensor.template.publish:
        id: text_response
        state: "..."
    - script.execute: draw_display
  on_stt_vad_end:
    - lambda: ESP_LOGD("voice_assistant", "on_stt_vad_end");
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: draw_display
  on_stt_end:
    - text_sensor.template.publish:
        id: text_request
        state: !lambda return x;
    - script.execute: draw_display
  on_intent_progress:
    - if:
        condition:
          # A nonempty x variable means a streaming TTS url was sent to the media player
          lambda: 'return !x.empty();'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
  on_tts_start:
    - if:
        condition:
          # The intent_progress trigger didn't start the TTS Response
          lambda: 'return id(voice_assistant_phase) != ${voice_assist_replying_phase_id};'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
    - text_sensor.template.publish:
        id: text_response
        state: !lambda return x;
    - script.execute: draw_display
  on_tts_end:
    - lambda: ESP_LOGD("voice_assistant", "on_tts_end");
    - if:
        condition:
          and:
            - switch.is_on: mute_response_switch
            - switch.is_off: media_mute
            - switch.is_off: ext_media_mute
        then:
          - switch.turn_on: media_mute
          - switch.turn_on: ext_media_mute
    - script.execute: draw_display
    - if:
        condition:
          - switch.is_on: output_audio
        then:
          - homeassistant.service:
              service: media_player.play_media
              data:
                entity_id: media_player.${external_media_player}
                media_content_id: !lambda 'return x;'
                media_content_type: music
                announce: "true"
    - delay: 10s
    - script.execute: draw_display
  on_idle:
    - lambda: ESP_LOGD("voice_assistant", "on_idle");
    - script.execute: draw_display
  on_end:
    - lambda: ESP_LOGD("voice_assistant", "on_end"); 
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    - lambda: ESP_LOGD("voice_assistant", "on_end announcement finished");
    - wait_until:
        - and:
            - not:
                media_player.is_announcing:
            - not:
                media_player.is_playing:
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0
        duration: 1.0s
    - lambda: id(global_is_assisting) = false;
    - lambda: ESP_LOGD("voice_assistant", "on_end starting wake word again"); 
    - if:
        condition:
          - lambda: return id(wake_word_engine_location).current_option() == "On device";
        then:
          - lambda: id(va).set_use_wake_word(false);
          - delay: 500ms
          - micro_wake_word.start:
    - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display
    - if:
        condition:
          and:
            - switch.is_on: mute_response_switch
            - switch.is_on: media_mute
            - switch.is_on: ext_media_mute
        then:
          - switch.turn_off: media_mute
          - switch.turn_off: ext_media_mute
    - text_sensor.template.publish:
        id: text_request
        state: ""
    - text_sensor.template.publish:
        id: text_response
        state: ""
  on_error:
    - if:
        condition:
          lambda: return !id(init_in_progress);
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: draw_display
          - delay: 1s
          - if:
              condition:
                switch.is_off: mute_switch
              then:
                - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
              else:
                - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
          - script.execute: draw_display
    - lambda: id(global_is_assisting) = false;
  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - script.execute: start_wake_word
    - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display
  on_client_disconnected:
    - script.execute: stop_wake_word
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: draw_display
  on_timer_started:
    - script.execute: timer_ending
    - script.execute: draw_display
  on_timer_cancelled:
    - lambda: id(time_remaining_0).publish_state ("0:00:00");
    - lvgl.widget.hide: lbl_timer
    - lvgl.widget.hide: bar_timer
    - script.execute: draw_display
  on_timer_updated:
    - script.execute: draw_display
  on_timer_tick:
    - lambda: |-
        int seconds = timers[0].seconds_left;
        int hours = seconds / 3600;
        int minutes = (seconds % 3600) / 60;
        seconds %= 60;
        id(time_remaining_0).publish_state(str_sprintf("%d:%02d:%02d", hours, minutes, seconds));
    - lambda: id(draw_timer_timeline).execute();
  on_timer_finished:
    - lambda: id(voice_assistant_phase) = ${voice_assist_timer_finished_phase_id};
    - switch.turn_on: timer_ringing
    - script.execute: draw_display

script:
  - id: draw_display
    then:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - script.execute: saver_enabled
            - if:
                condition:
                  or:
                    - lambda: return id(ethernet_connection);
                    - lambda: return id(wifi_connection);
                then:
                  - lvgl.widget.show: lbl_wifi
                  - if:
                      condition:
                        - lambda: return id(api_connection);
                      then:
                        - if:
                            condition:
                              switch.is_on: timer_ringing
                            then:
                              - lambda: id(voice_assistant_phase) = ${voice_assist_timer_finished_phase_id};
                        - lvgl.widget.show: lbl_api
                        - lvgl.widget.show: topbar_container
                        - script.execute: set_uimode
                        - if:
                            condition:
                              not:
                                or:
                                  - lambda: |-
                                      return (id(voice_assistant_phase) == ${voice_assist_listening_phase_id});
                                  - lambda: |-
                                      return (id(voice_assistant_phase) == ${voice_assist_thinking_phase_id});
                                  - lambda: |-
                                      return (id(voice_assistant_phase) == ${voice_assist_replying_phase_id});
                                  - lambda: |-
                                      return (id(voice_assistant_phase) == ${voice_assist_error_phase_id});
                                  - lambda: |-
                                      return (id(voice_assistant_phase) == ${voice_assist_timer_finished_phase_id});
                                  - lambda: |-
                                      return (id(voice_assistant_phase) == ${voice_assist_timer_finishing_phase_id});
                                  - lvgl.page.is_showing: notification_page
                                  - lvgl.page.is_showing: image_page
                                  - lvgl.page.is_showing: alarm_keypad_page
                                  - lvgl.page.is_showing: idle_page
                                  - lvgl.page.is_showing: climate_page
                                  - lvgl.page.is_showing: climate_studio_page
