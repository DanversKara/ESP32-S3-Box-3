key_collector:
  - source_id: lvgl_keypad
    min_length: 4
    max_length: 12
    end_keys: "#"
    end_key_required: true
    back_keys: "*"
    allowed_keys: "0123456789*#"
    timeout: 10s
    on_progress:
      - if:
          condition:
            lambda: return (0 != x.compare(std::string{""}));
          then:
            - lambda: |-
                ESP_LOGD("LVGL Keypad", "Current PIN: %s", x.c_str());
    on_timeout:
      - if:
          condition:
            lambda: return (id(alarm_action) == "unlock_front_door" || id(alarm_action) == "settings_unlock" || id(alarm_action) == "view_wifi" || id(alarm_action) == "view_alarmclock");
          then:
            - lambda: id(alarm_action) = "";
            - lvgl.page.show: main_lock_page
          else:
            - lvgl.page.show: security_page
    on_result:
      - lambda: |-
          ESP_LOGD("LVGL Keypad", "Submitted PIN: %s", x.c_str());
      - if:
          condition:
            lambda: return (id(alarm_action) == "unlock_front_door");
          then:
            - if:
                condition:
                  lambda: return (0 == x.compare(std::string("${master_pin}")));
                then:
                  - homeassistant.action:
                      action: lock.unlock
                      data:
                        entity_id: ${front_door_entity}
                else:
                  - lvgl.label.update:
                      id: lbl_keypad_error
                      text: "Incorrect PIN"
                  - lvgl.widget.show: lbl_keypad_error
            - lambda: id(alarm_action) = "";
            - lvgl.page.show: main_lock_page
          else:
            - if:
                condition:
                  lambda: return (id(alarm_action) == "settings_unlock");
                then:
                  - if:
                      condition:
                        lambda: return (0 == x.compare(std::string("${settings_pin}")));
                      then:
                        - lvgl.page.show: idle_page
                      else:
                        - lvgl.label.update:
                            id: lbl_keypad_error
                            text: "Incorrect PIN"
                        - lvgl.widget.show: lbl_keypad_error
                        - lvgl.page.show: main_lock_page
                  - lambda: id(alarm_action) = "";
                else:
                  - if:
                      condition:
                        lambda: return (id(alarm_action) == "view_wifi");
                      then:
                        - if:
                            condition:
                              lambda: return (0 == x.compare(std::string("${settings_pin}")));
                            then:
                              - lvgl.page.show: wifi_page
                            else:
                              - lvgl.label.update:
                                  id: lbl_keypad_error
                                  text: "Incorrect PIN"
                              - lvgl.widget.show: lbl_keypad_error
                              - lvgl.page.show: main_lock_page
                        - lambda: id(alarm_action) = "";
                      else:
                        - if:
                            condition:
                              lambda: return (id(alarm_action) == "view_alarmclock");
                            then:
                              - if:
                                  condition:
                                    lambda: return (0 == x.compare(std::string("${settings_pin}")));
                                  then:
                                    - lvgl.page.show: alarmclock_page
                                  else:
                                    - lvgl.label.update:
                                        id: lbl_keypad_error
                                        text: "Incorrect PIN"
                                    - lvgl.widget.show: lbl_keypad_error
                                    - lvgl.page.show: main_lock_page
                              - lambda: id(alarm_action) = "";
                            else:
                              - if:
                                  condition:
                                    lambda: return (id(alarm_action) == "disarm");
                                  then:
                                    - homeassistant.service:
                                          service: alarm_control_panel.alarm_disarm
                                          data:
                                            entity_id: ${alarm_entity}
                                            code: !lambda return x.c_str();
                              - if:
                                  condition:
                                    lambda: return (id(alarm_action) == "armhome");
                                  then:
                                    - homeassistant.service:
                                          service: alarm_control_panel.alarm_arm_home
                                          data:
                                            entity_id: ${alarm_entity}
                                            code: !lambda return x.c_str();
                              - if:
                                  condition:
                                    lambda: return (id(alarm_action) == "armaway");
                                  then:
                                    - homeassistant.service:
                                          service: alarm_control_panel.alarm_arm_away
                                          data:
                                            entity_id: ${alarm_entity}
                                            code: !lambda return x.c_str();
                              - if:
                                  condition:
                                    lambda: return (id(alarm_action) == "armnight");
                                  then:
                                    - homeassistant.service:
                                          service: alarm_control_panel.alarm_arm_night
                                          data:
                                            entity_id: ${alarm_entity}
                                            code: !lambda return x.c_str();
                              - lambda: id(alarm_action) = "";
                              - script.execute: set_alarm_status
                              - lvgl.page.show: security_page
                    
###### LVGL Display UI ######
# All UI configuration is below. 
# The sequences of pages impacts the next/previous buttons.
# The UI sends actions to entities while entities send status or can change icons/colors/properties.
# This means most widgets that perform an action on an entity the corresponding entity updates the widget.
#############################
lvgl:
  id: lvgl_display
  bottom_layer:
    bg_color: 0x000000
  buffer_size: 100%
  byte_order: ${lvgl_byte_order}
  on_idle:
    - timeout: 1s
      then:
        - script.execute: saver_enabled
  pages:
    - id: main_lock_page
      skip: true
      on_swipe_left:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
      on_swipe_right:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
      widgets:
        - obj:
            styles: page_content
            widgets:
              - button:
                  id: but_front_door_lock
                  width: 100%
                  height: 100%
                  align: CENTER
                  bg_color: 0x330000
                  bg_grad_color: 0x1a0000
                  bg_grad_dir: VER
                  bg_opa: COVER
                  border_width: 0
                  radius: 0
                  shadow_width: 0
                  widgets:
                    - label:
                        id: ico_front_door_lock
                        align: CENTER
                        y: -34
                        text_font: icon_font_80
                        text_color: red
                        text: "\U000F033F"
                    - label:
                        id: lbl_front_door_status
                        align: CENTER
                        y: 40
                        text_font: labelfont_large
                        text_align: CENTER
                        text_color: red
                        text: "UNLOCKED"
                    - label:
                        id: lbl_front_door_action
                        align: CENTER
                        y: 68
                        text_font: my_font16
                        text_align: CENTER
                        text_color: 0xCCCCCC
                        text: "Tap to Lock"
                    - label:
                        align: TOP_MID
                        y: 6
                        text_font: my_font16
                        text_align: CENTER
                        text_color: 0xCCCCCC
                        text: '${front_door_name}'
                    - label:
                        id: lbl_door_alarm_status
                        align: TOP_MID
                        y: 32
                        text_font: my_font12
                        text_align: CENTER
                        text_color: 0xCCCCCC
                        text: '${door_alarm_door_name}: --'
                  on_release:
                    then:
                      - if:
                          condition:
                            lambda: return (id(front_door_item).state == "locked");
                          then:
                            - if:
                                condition:
                                  switch.is_on: front_door_require_pin
                                then:
                                  - lvgl.widget.hide: lbl_keypad_error
                                  - lambda: id(alarm_action) = "unlock_front_door";
                                  - lvgl.page.show: alarm_keypad_page
                                else:
                                  - homeassistant.action:
                                      action: lock.unlock
                                      data:
                                        entity_id: ${front_door_entity}
                      - if:
                          condition:
                            lambda: return (id(front_door_item).state == "unlocked" || id(front_door_item).state == "open");
                          then:
                            - homeassistant.action:
                                action: lock.lock
                                data:
                                  entity_id: ${front_door_entity}
              # ── Small settings gear — reveals all hidden pages after settings_pin ──
              - button:
                  id: but_lock_settings
                  width: 44
                  height: 44
                  align: TOP_RIGHT
                  x: -6
                  y: 6
                  bg_color: 0x000000
                  bg_opa: 30%
                  border_width: 0
                  radius: 22
                  shadow_width: 0
                  widgets:
                    - label:
                        id: ico_lock_settings
                        align: CENTER
                        text_font: icon_font_30
                        text_color: 0xAAAAAA
                        text: "\U000F0493"
                  on_release:
                    - lvgl.widget.hide: lbl_keypad_error
                    - lambda: id(alarm_action) = "settings_unlock";
                    - lvgl.page.show: alarm_keypad_page

    - id: idle_page
